# Tool versions come from uv.lock, not a second independent version list.
minimum_pre_commit_version: '4.6.2'
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff safe fixes
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: tach
        name: Package boundaries
        entry: uv run --locked tach check
        language: system
        pass_filenames: false
        always_run: true
