[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "eeg-ads1299-lab"
version = "0.1.0"
description = "Bench-only ADS1299 learning models, transport, and hardware contracts"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5", "scipy==1.17.0", "matplotlib==3.10.8", "scikit-learn==1.8.0",
]

[project.optional-dependencies]
serial = ["pyserial==3.5"]

[dependency-groups]
dev = [
  "ruff==0.16.8", "pyrefly==1.3.1", "complexipy==8.0.1", "tach==0.35.1",
  "pytest==9.0.2", "pytest-cov==7.1.0", "hypothesis==6.168.1",
  "pre-commit==4.6.2", "types-pyserial==3.5.0.20260712", "typing-extensions==4.15.0",
]

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
packages = ["lab", "hardware", "tools"]
