[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "eeg-ads1299-lab"
version = "0.1.0"
description = "Bench-only ADS1299 learning models, transport, and hardware contracts"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.17.0",
    "matplotlib==3.10.8",
    "scikit-learn==1.8.0",
]

[project.optional-dependencies]
serial = ["pyserial==3.5"]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "pyrefly==1.3.1",
    "complexipy==8.0.1",
    "tach==0.35.1",
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.1",
    "pre-commit==4.6.2",
    "scipy-stubs==1.17.0.0",
    "types-pyserial==3.5.0.20260712",
    "typing-extensions==4.15.0",
]

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
packages = ["lab", "hardware", "tools"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "hardware/rev_a"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
markers = [
    "native: requires a native compiler, Node, or external simulator",
    "integration: uses real processes or localhost sockets",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
unsafe-fixes = false
extend-exclude = ["results", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "RUF", "ANN", "PGH"]

[tool.pyrefly]
python-version = "3.11"
preset = "strict"
project-includes = ["lab/**/*.py", "tools/**/*.py", "hardware/**/*.py", "tests/**/*.py", "run_lab.py"]

[tool.pyrefly.errors]
explicit-any = "error"
no-any-return = "error"
implicit-reexport = "error"
unknown-argument-type = "error"
unknown-attribute-type = "error"
unknown-variable-type = "error"

[tool.complexipy]
paths = ["lab", "tools", "hardware", "tests", "run_lab.py"]
max-complexity-allowed = 15
ignore-complexity = false
snapshot-ignore = true
no-ignore = true

[tool.coverage.run]
branch = true
source = ["lab", "hardware.rev_a", "tools", "run_lab"]
patch = ["subprocess"]
omit = ["*/test_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.lab-check]
# Measured branch coverage, not the combined line/branch coverage percentage.
minimum-branch-coverage = 71.0
