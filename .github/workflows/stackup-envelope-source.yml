name: Stackup requirements source
on:
  push:
    branches: [workbench/stackup-envelope-source]
    paths: [.github/workflows/stackup-envelope-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 8403c4eefc6fd6f1303a75510755f16f983e71c4
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact existing source without rebuilding CAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8403c4eefc6fd6f1303a75510755f16f983e71c4
          test "$(git rev-parse HEAD^{tree})" = 4f5bebbc578c15f63c3463f2b3cef0bd28fbdfa9
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source"
          git branch stackup-source HEAD
          git bundle create "$RUNNER_TEMP/source/repository.bundle" stackup-source
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          sha256sum hardware/rev_a/layout/rev_a.kicad_pcb > "$RUNNER_TEMP/source/board.sha256"
          cd "$RUNNER_TEMP/source"
          sha256sum repository.bundle identity.txt board.sha256 > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stackup-envelope-source
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 7
