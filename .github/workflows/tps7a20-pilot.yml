name: TPS7A20 compatibility pilot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pilot:
    if: github.head_ref == 'spike/tps7a20-native-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: b6ff7d460464adbed60797ff8aa0ca85d618e3e7
          persist-credentials: false
      - name: Install complete simulator and retrieve pinned source
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ngspice
          mkdir -p /tmp/pilot-input reports/tps7a20-pilot
          curl -fL --max-time 45 https://www.ti.com/lit/zip/sbvm961 -o /tmp/pilot-input/sbvm961.zip
          echo '4db279371817cb0873e103b03ddf26c6a5a1ff2c4672093c0037c940dc8c8fd2  /tmp/pilot-input/sbvm961.zip' | sha256sum -c -
          ngspice --version > reports/tps7a20-pilot/ngspice-version.txt
          dpkg -L ngspice > reports/tps7a20-pilot/package-files.txt
          tar -C / -czf reports/tps7a20-pilot/native-runtime.tar.gz usr/lib/x86_64-linux-gnu/ngspice usr/share/ngspice/scripts
      - name: Execute bounded reference and selected-setpoint probes
        run: |
          python - <<'PY'
          import hashlib, json, math, pathlib, subprocess, zipfile
          base=pathlib.Path('reports/tps7a20-pilot').resolve()
          archive=pathlib.Path('/tmp/pilot-input/sbvm961.zip')
          library=zipfile.ZipFile(archive).read('tps7a20-adj_trans.lib')
          assert hashlib.sha256(library).hexdigest()=='154acfdd2199ac44259908b90b07d15bc7e535a45c8c51d1413894c900718b69'
          model=pathlib.Path('/tmp/pilot-input/vendor.lib');model.write_bytes(library)
          results=[]
          for compat,setpoint,shutdown in [(False,1.,True),(True,1.,True),(True,3.3,False),(True,3.3,True)]:
              folder=base/f'ps_{compat}_vout_{setpoint}_shutdown_{shutdown}';folder.mkdir()
              if compat:(folder/'.spiceinit').write_text('set ngbehavior=ps\n')
              vin='PULSE(0 5 1m 1u 1u 10m)' if shutdown else 'PWL(0 0 1m 0 1.001m 5 20m 5)'
              load='' if setpoint==1 else 'Iload out 0 PWL(0 .003 8m .003 8.001m .010 12m .010 12.001m .003 20m .003)\n'
              text=f'TPS7A20 unchanged vendor model compatibility probe\n.param V_out={setpoint}\n.include "{model}"\nVin in 0 {vin}\nXreg in 0 in nc out TPS7A20_ADJ_TRANS\nCin in 0 1u\nCout out 0 1u\nRnc nc 0 1e12\n{load}.options reltol=1e-5 abstol=1e-10 vntol=1e-7 method=gear\n.control\nset wr_singlescale\nset wr_vecnames\nset numdgt=15\ntran 1u 20m 0 1u\nwrdata transient.txt v(in) v(out)\nquit\n.endc\n.end\n'
              netlist=folder/'network.cir';netlist.write_text(text)
              item={'ps_compatibility':compat,'V_out_parameter':setpoint,'shutdown_requested':shutdown}
              try:
                  result=subprocess.run(['ngspice','-b',str(netlist)],cwd=folder,capture_output=True,text=True,timeout=45)
                  (folder/'ngspice.log').write_text(result.stdout+'\n'+result.stderr)
                  item['exit_code']=result.returncode
                  table=folder/'transient.txt'
                  rows=[list(map(float,line.split())) for line in table.read_text().splitlines()[1:]] if table.exists() else []
                  item['rows']=len(rows)
                  item['last_time_s']=rows[-1][0] if rows else None
                  item['completed_requested_window']=bool(result.returncode==0 and rows and all(len(row)==3 and all(math.isfinite(x) for x in row) for row in rows) and abs(rows[-1][0]-.02)<1e-9)
                  if rows:item['final_output_v']=rows[-1][2]
              except Exception as exc:
                  item['error']=str(exc);item['completed_requested_window']=False
              results.append(item)
          (base/'pilot.json').write_text(json.dumps({'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'library_sha256':hashlib.sha256(library).hexdigest(),'library_edited':False,'probes':results,'hardware_validated':False},indent=2)+'\n')
          print(json.dumps(results,indent=2))
          PY
      - name: Retain pilot evidence without vendor model redistribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tps7a20-compatibility-pilot
          path: reports/tps7a20-pilot/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
