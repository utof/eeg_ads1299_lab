name: C2 source
on:
  push:
    branches: [workbench/bus-interlock-c2]
    paths: [.github/workflows/c2-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 99bafcea6b3fa518e76704061daf722aae539360
          fetch-depth: 0
          persist-credentials: false
      - name: Capture source and history
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 99bafcea6b3fa518e76704061daf722aae539360
          test "$(git rev-parse HEAD^{tree})" = 1448f9179fffaa43431053b4383ba9cc80fa98f2
          mkdir -p "$RUNNER_TEMP/source"
          git branch c2-base HEAD
          git bundle create "$RUNNER_TEMP/source/repository.bundle" c2-base
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum repository.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c2-base-source
          path: ${{ runner.temp }}/source/
          retention-days: 7
          if-no-files-found: error
