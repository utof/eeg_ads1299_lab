name: Input review source
on:
  push:
    branches: [workbench/input-review-source]
    paths: [.github/workflows/input-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 5197c5b9478391e305c5d41f6c992bbdcd6bfd56
          fetch-depth: 0
          persist-credentials: false
      - name: Capture original source and history without changing CAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5197c5b9478391e305c5d41f6c992bbdcd6bfd56
          test "$(git rev-parse HEAD^{tree})" = eecf9efb62f13d2cbda4d3815bed3de05a231fb6
          mkdir -p "$RUNNER_TEMP/source"
          git branch input-review-source HEAD
          git bundle create "$RUNNER_TEMP/source/repository.bundle" input-review-source
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          sha256sum hardware/rev_a/layout/rev_a.kicad_pcb > "$RUNNER_TEMP/source/board.sha256"
          test -z "$(git status --porcelain)"
          cd "$RUNNER_TEMP/source"
          sha256sum repository.bundle identity.txt board.sha256 > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: input-review-source
          path: ${{ runner.temp }}/source/
          retention-days: 7
          if-no-files-found: error
