name: Schematic
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-schematic:
    name: Native KiCad and connectivity
    runs-on: ubuntu-24.04
    container: debian:trixie@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      KICAD9_FOOTPRINT_DIR: /usr/share/kicad/footprints
    steps:
      - name: Install pinned native CAD engine and libraries
        run: |
          apt-get update -qq
          apt-get install --yes --no-install-recommends ca-certificates git python3 python3-pip python3-venv kicad=9.0.2+dfsg-1 kicad-symbols=9.0.2-1 kicad-footprints=9.0.2-1 > /tmp/cad-install.log 2>&1 || { tail -60 /tmp/cad-install.log; exit 1; }
          python3 -m pip install --break-system-packages uv==0.12.18
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install locked environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv sync --locked --all-extras
      - name: Run the same ordinary and native schematic gate
        run: uv run --locked python -m tools.check --schematic --out reports/schematic
      - name: Verify checks did not modify source
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Retain native outputs and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-schematic-evidence
          path: reports/schematic/
          if-no-files-found: error
          retention-days: 14
