name: Preserve PR62 pad-contact review
on:
  push:
    branches: [workbench/pr62-review-continuation]
    paths: [.github/workflows/pr62-pad-review.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify data-only original bundle before import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess
          data = base64.b64decode('', validate=True)
          assert len(data) == 3557
          assert hashlib.sha256(data).hexdigest() == '7beb88ab7a0ad7f8faa391768130c74dc25e69d09e860548083c856fe70de207'
          pathlib.Path('/tmp/pad-review.bundle').write_bytes(data)
          subprocess.run(['git', 'bundle', 'verify', '/tmp/pad-review.bundle'], check=True)
          subprocess.run(['git', 'fetch', '/tmp/pad-review.bundle', 'HEAD'], check=True)
          PY
          test "$(git rev-parse FETCH_HEAD)" = 3f68c4c9e5c35009940d0a7ea168e66c325d46b4
          test "$(git rev-parse FETCH_HEAD^{tree})" = 006c2ebae18e253764ee54e803cdcc8728218ac1
          git merge-base --is-ancestor dd7511bb816af00054c9319a6db5a8509feb0a80 FETCH_HEAD
          test "$(git rev-list --count dd7511bb816af00054c9319a6db5a8509feb0a80..FETCH_HEAD)" = 3
          git diff --exit-code dd7511bb816af00054c9319a6db5a8509feb0a80 FETCH_HEAD -- hardware firmware lab pyproject.toml uv.lock
          git push origin 3f68c4c9e5c35009940d0a7ea168e66c325d46b4:refs/heads/archive/pr62-pad-review-3f68c4c
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: archive/pr62-pad-review-3f68c4c
          fetch-depth: 0
          path: fresh
          persist-credentials: false
      - name: Verify separate GitHub checkout
        shell: bash
        run: |
          set -euo pipefail
          cd fresh
          test "$(git rev-parse HEAD)" = 3f68c4c9e5c35009940d0a7ea168e66c325d46b4
          test "$(git rev-parse HEAD^{tree})" = 006c2ebae18e253764ee54e803cdcc8728218ac1
          printf '%s  %s\n' 611218bae6559fb2488309fc80eee20ce2d6b5855977d52d600f947099179b43 hardware/rev_a/layout/rev_a.kicad_pcb | sha256sum -c -
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
          git log -3 --oneline
