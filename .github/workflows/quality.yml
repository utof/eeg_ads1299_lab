name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_PYTHON_DOWNLOADS: never
  MPLBACKEND: Agg
  TERM: dumb
jobs:
  quality:
    name: Python ${{ matrix.python }} quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned environment manager
        run: python -m pip install uv==0.12.18
      - name: Install locked project and development dependencies
        run: uv sync --locked --all-extras
      - name: Validate actual new commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --locked python -m tools.commit_messages --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Run the shared quality gate
        run: uv run --locked python -m tools.check
      - name: Exercise the actual commit hooks
        if: matrix.python == '3.13'
        run: |
          uv run --locked pre-commit run --all-files --show-diff-on-failure
          printf 'fix(dx): exercise the actual commit hook\n' > reports/check/commit-message.txt
          uv run --locked pre-commit run --hook-stage commit-msg --commit-msg-filename reports/check/commit-message.txt
          printf 'invalid subject\n' > reports/check/commit-message.txt
          if uv run --locked pre-commit run --hook-stage commit-msg --commit-msg-filename reports/check/commit-message.txt; then
            echo 'Invalid commit was unexpectedly accepted'; exit 1
          fi
      - name: Verify checks left tracked source and evidence unchanged
        if: always()
        run: git diff --exit-code HEAD
      - name: Retain quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-python-${{ matrix.python }}
          path: reports/check/
          if-no-files-found: warn
          retention-days: 14
  native:
    name: Native integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ngspice g++ nodejs
          ngspice --version
          g++ --version
          node --version
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
      - name: Run the shared gate including required native checks
        run: uv run --locked python -m tools.check --native
      - name: Verify checks left tracked source and evidence unchanged
        if: always()
        run: git diff --exit-code HEAD
      - name: Retain native simulation and transport evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-integration
          path: reports/check/
          if-no-files-found: warn
          retention-days: 14
