name: Apply reviewed corrections
on:
  push:
    branches: [refactor/adversarial-review]
    paths: ['.github/apply_review.py', '.github/workflows/review-authoring.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'utof/eeg_ads1299_lab' && github.ref == 'refs/heads/refactor/adversarial-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the locked environment and native tools
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ngspice g++ nodejs
      - name: Apply the reviewed edits and remove authoring scaffolding
        run: |
          git merge-base --is-ancestor 7aa0d1f5e693a43fb41028a3031e0d5c5fc4c940 HEAD
          uv run --locked python .github/apply_review.py
          uv run --locked python - <<'PY'
          from pathlib import Path
          path = Path('lab/recording.py')
          text = path.read_text()
          text = text.replace('from .data_types import Recording', 'from .data_types import BoolArray, Recording')
          text = text.replace('        indices = np.flatnonzero(data["block"] == block)', '        mask: BoolArray = data["block"] == block\n        indices = np.flatnonzero(mask)')
          text = text.replace('        indices = np.flatnonzero(data["session"] == session)', '        mask: BoolArray = data["session"] == session\n        indices = np.flatnonzero(mask)')
          path.write_text(text)
          path = Path('tests/test_review_regressions.py')
          text = path.read_text()
          for pattern in ('counts|24-bit', 'time|continu', 'condition|block', 'session|block', 'scale|lsb'):
              text = text.replace(f'match="{pattern}"', f'match=r"{pattern}"')
          text = text.replace('recording["time_s"][99] + delta', 'float(recording["time_s"][99]) + delta')
          text = text.replace('recording["condition"][100] ^= 1', 'recording["condition"][100] = int(recording["condition"][100]) ^ 1')
          path.write_text(text)
          PY
          rm .github/apply_review.py .github/workflows/review-authoring.yml .github/workflows/review-regressions.yml
          uv run --locked ruff check --fix .
          uv run --locked ruff format .
      - name: Preserve the hardware and historical evidence exactly
        run: git diff --exit-code 7aa0d1f5e693a43fb41028a3031e0d5c5fc4c940 -- 'hardware/rev_a/*.json' firmware results VALIDATION.json SHA256SUMS.txt requirements-tested.txt
      - name: Commit the concrete corrections without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(review): enforce recording, transport, and evidence contracts'
          git push origin HEAD:refs/heads/refactor/adversarial-review
      - name: Run the unchanged canonical quality and native gate
        run: uv run --locked python -m tools.check --native
      - name: Additional diagnostics after a failed gate
        if: failure()
        run: |
          uv run --locked pyrefly check --min-severity warn || true
          uv run --locked complexipy --failed || true
          uv run --locked tach check || true
          uv run --locked python -m pytest tests/test_review_regressions.py tests/test_review_artifacts.py -q || true
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-corrections
          path: reports/
