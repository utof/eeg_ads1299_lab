name: Supply Return Context
on:
  push:
    branches: [workbench/supply-return-context]
    paths: [.github/workflows/supply-return-context.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: f6932ead58c1d02af145de405312a7f885dbb010
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve immutable source only
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = f6932ead58c1d02af145de405312a7f885dbb010
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source"
          git branch captured-supply-base HEAD
          git bundle create "$RUNNER_TEMP/source/repository.bundle" captured-supply-base
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum repository.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-return-base
          path: ${{ runner.temp }}/source/
          retention-days: 7
          if-no-files-found: error
