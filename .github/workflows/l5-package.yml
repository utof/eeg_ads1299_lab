name: L5 read-only R24 source packaging
on:
  push:
    branches: [workbench/l5-native-runtime]
    paths: [.github/workflows/l5-package.yml]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e57d4cddb3304a1cc15cbce9f9e679178e4f1b16
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
      - name: Fetch one immutable authoring artifact as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api repos/utof/eeg_ads1299_lab/actions/artifacts/11560957956/zip > /tmp/l5-data.zip
          echo '0a066352d46f83ef65cbe782be5fc5f91fbaafadecad9610bd2b0ebae8857988  /tmp/l5-data.zip' | sha256sum -c -
      - name: Show bounded original failures and related input schemas
        run: |
          python3 - <<'PY'
          import re, zipfile, pathlib
          with zipfile.ZipFile('/tmp/l5-data.zip') as z:
              text=z.read('ordinary-gate.log').decode()
          sections=re.split(r'(?m)^_{5,}\s+(.+?)\s+_{5,}\s*$',text)
          seen=set()
          for i in range(1,len(sections)-1,2):
              name=sections[i]; base=name.split('[')[0]
              if base in seen or 'two_terminal_series_boundary' in name: continue
              seen.add(base)
              print('FAILURE_DETAIL',name,'\n',sections[i+1][-4500:])
          paths=['hardware/rev_a/current_return.py','hardware/rev_a/test_baseline.py','tests/test_schematic_contract.py','tests/test_pcb_seed.py','tests/test_schematic_bom.py','tests/test_schematic_gate.py','tests/test_supply_acceptance_s3.py','tests/test_steady_source_s4.py']
          for rel in paths:
              p=pathlib.Path(rel)
              if not p.exists(): continue
              lines=p.read_text().splitlines()
              keep=set()
              for i,line in enumerate(lines):
                  if any(key in line for key in ('source_hash','sha256','MD_BOM','markdown_bom','dnp','len(graph','69','251','77','MISO','render_bom','bom_markdown')):
                      keep.update(range(max(0,i-3),min(len(lines),i+5)))
              print('INPUT_ANCHORS',rel)
              for i in sorted(keep): print(f'{i+1}: {lines[i]}')
          PY
