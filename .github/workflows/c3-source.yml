name: C3 source
on:
  push:
    branches: [workbench/aux-native-c3]
    paths: [.github/workflows/c3-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 98362c6b6445ddb402ddf942b1c81af738eebe56
          fetch-depth: 0
          persist-credentials: false
      - name: Capture original source without CAD regeneration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 98362c6b6445ddb402ddf942b1c81af738eebe56
          test "$(git rev-parse HEAD^{tree})" = d88d3ae402ce9bdfd9d52302f0da37c2faff0ed8
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source"
          git branch c3-base HEAD
          git bundle create "$RUNNER_TEMP/source/repository.bundle" c3-base
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum repository.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c3-base-source
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 7
