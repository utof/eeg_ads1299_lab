name: Connector decision source
on:
  push:
    branches: [workbench/connector-decision]
    paths: [.github/workflows/connector-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: a55ce97a6029a4759d23f1f528feda3c5a0dc6b8
          fetch-depth: 0
          persist-credentials: false
      - name: Capture source without changing CAD
        run: |
          set -eu
          test "$(git rev-parse HEAD^{tree})" = 71d3525fcd66da39e5306d596801b3fb40d03c16
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source"
          git branch connector-source HEAD
          git bundle create "$RUNNER_TEMP/source/repository.bundle" connector-source
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum repository.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connector-decision-source
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 7
