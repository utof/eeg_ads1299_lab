name: PR98 reference-gap triage
on:
  push:
    branches: [workbench/pr98-source-publication-20261010]
    paths: [.github/workflows/pr98-reference-triage.yml]
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-24.04
    container: debian:trixie@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      KICAD9_FOOTPRINT_DIR: /usr/share/kicad/footprints
    steps:
      - name: Install pinned native tools
        run: |
          apt-get update -qq
          apt-get install --yes --no-install-recommends ca-certificates git g++ python3 python3-pip python3-venv kicad=9.0.2+dfsg-1 kicad-symbols=9.0.2-1 kicad-footprints=9.0.2-1 > /tmp/cad-install.log 2>&1 || { tail -60 /tmp/cad-install.log; exit 1; }
          python3 -m pip install --break-system-packages uv==0.12.18
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e10d0f60f39de7118f555777a8f25f5a357be592
          fetch-depth: 0
          persist-credentials: false
      - name: Locate actual missing reference areas without modifying source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv sync --locked --all-extras
          uv run --locked python - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          from tests.test_auxiliary_ground import _fresh
          from tests.test_auxiliary_placement import CAD,BOARD
          from tests.auxiliary_ground_probe import SCRIPT as P2
          from tests.auxiliary_routing_probe import SCRIPT as P3
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='e10d0f60f39de7118f555777a8f25f5a357be592'
          out=pathlib.Path('reports/reference-triage');out.mkdir(parents=True)
          cad=out/'cad';shutil.copytree(CAD,cad)
          drc=_fresh(cad)
          assert all(drc[k]==[] for k in ('schematic_parity','violations','unconnected_items'))
          geometry = '''
          def bounds(s):
              q=s.BBox();return [q.GetX()/1e6,q.GetY()/1e6,q.GetRight()/1e6,q.GetBottom()/1e6]
          gaps=[]
          for t in tracks:
              if t.Type()!=p.PCB_TRACE_T or t.GetNetname() in planes:continue
              spine=uncovered(t,p.FromMM(.10));full=uncovered(t,t.GetWidth())
              outside=full.CloneDropTriangulation();old=known.get((t.GetNetname(),b.GetLayerName(t.GetLayer())))
              if old is not None:outside.BooleanSubtract(old)
              if spine.Area()/1e12>1e-6 or outside.Area()/1e12>1e-6:
                  gaps.append({'uuid':t.m_Uuid.AsString(),'net':t.GetNetname(),'layer':b.GetLayerName(t.GetLayer()),'start':[t.GetStart().x/1e6,t.GetStart().y/1e6],'end':[t.GetEnd().x/1e6,t.GetEnd().y/1e6],'width':t.GetWidth()/1e6,'spine_area':spine.Area()/1e12,'new_full_area':outside.Area()/1e12,'new_full_bounds':bounds(outside)})
          vias=[{'uuid':t.m_Uuid.AsString(),'net':t.GetNetname(),'xy':[t.GetPosition().x/1e6,t.GetPosition().y/1e6]} for t in tracks if t.Type()==p.PCB_VIA_T and 25<t.GetPosition().x/1e6<44 and 4<t.GetPosition().y/1e6<17]
          positions={f.GetReference():{'center':[f.GetPosition().x/1e6,f.GetPosition().y/1e6],'pads':{a.GetNumber():{'net':a.GetNetname(),'xy':[a.GetPosition().x/1e6,a.GetPosition().y/1e6]} for a in f.Pads()}} for f in b.GetFootprints() if f.GetReference() in ('U102','C104','R117','R118','R119','R120')}
          print(json.dumps({'diagnostic_only':True,'gaps':gaps,'nearby_vias':vias,'positions':positions},indent=2))
          '''
          script=P3.split('rows=defaultdict',1)[0]+'\n'+geometry
          p2=P2.replace("assert q.Area()/1e12<=1e-6,label+' local reference gap'", "print(json.dumps({'diagnostic_corridor':label,'start':a,'end':c,'gap_area':q.Area()/1e12,'gap_bounds':bb(q)}))")
          for name,code,args in [('p3-gaps',script,['reference','tests/fixtures/auxiliary_p3_pending_edges.json']),('c104-corridors',p2,['bypass-C104'])]:
              r=subprocess.run(['/usr/bin/python3','-c',code,str(cad/BOARD.name),*args],capture_output=True,text=True,timeout=90)
              (out/(name+'.log')).write_text(r.stdout+r.stderr)
              assert r.returncode==0,r.stdout+r.stderr
              print(name,r.stdout)
          (out/'identity.json').write_text(json.dumps({'source':'e10d0f60f39de7118f555777a8f25f5a357be592','tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'diagnostic_not_gate':True,'sha256':{str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file()}},indent=2)+'\n')
          PY
      - name: Verify no tracked source changed
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr98-reference-triage
          path: reports/reference-triage/
          retention-days: 14
          if-no-files-found: error
