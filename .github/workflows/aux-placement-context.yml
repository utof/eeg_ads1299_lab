name: Auxiliary Placement Context
on:
  push:
    branches: [workbench/aux-placement-context]
    paths: [.github/workflows/aux-placement-context.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    container: debian:trixie@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    timeout-minutes: 12
    steps:
      - name: Install pinned CAD engine
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git python3 kicad=9.0.2+dfsg-1 kicad-symbols=9.0.2-1 kicad-footprints=9.0.2-1 > /tmp/install.log 2>&1 || { tail -60 /tmp/install.log; exit 1; }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: bc761c69558bbcf87a4c357c778828cc4da4928f
          fetch-depth: 0
          persist-credentials: false
      - name: Capture read-only source and native context
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = bc761c69558bbcf87a4c357c778828cc4da4928f
          test "$(git rev-parse HEAD^{tree})" = 0c4da842a103d0708cfbcc889696bf98373ef5e8
          test -z "$(git status --porcelain)"
          mkdir -p /tmp/capture /tmp/native
          git bundle create /tmp/capture/repository.bundle HEAD
          git rev-parse HEAD HEAD^{tree} > /tmp/capture/identity.txt
          python3 - <<'PY'
          from pathlib import Path
          import shutil,subprocess,re,hashlib,json
          files=set()
          for pkg in ['kicad','kicad-symbols','kicad-footprints']:
              for n in subprocess.check_output(['dpkg','-L',pkg],text=True).splitlines():
                  p=Path(n)
                  if p.is_file() and not any(x in n for x in ['/doc/','/locale/','/man/','/fonts/']):files.add(p)
          for p in list(files):
              if p.suffix in ('.so','.kiface') or p.name=='kicad-cli' or '.so.' in p.name:
                  result=subprocess.run(['ldd',str(p)],capture_output=True,text=True)
                  files.update(Path(n) for n in re.findall(r'(/[^\s()]+)',result.stdout) if Path(n).is_file())
          manifest={}
          for p in sorted(files):
              out=Path('/tmp/native')/str(p).lstrip('/')
              out.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,out)
              manifest[str(p).lstrip('/')]=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('/tmp/native/manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(len(manifest),'files')
          PY
          tar -C /tmp -czf /tmp/capture/native.tar.gz native
          cd /tmp/capture
          sha256sum repository.bundle identity.txt native.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auxiliary-placement-context
          path: /tmp/capture/
          retention-days: 7
          if-no-files-found: error
