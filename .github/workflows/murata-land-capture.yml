name: Disposable KEMET land guidance
on:
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    if: github.head_ref == 'investigate/murata-land-guidance'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Capture the public manufacturer T491 document
        shell: python
        run: |
          import datetime, hashlib, json, pathlib, urllib.request
          out=pathlib.Path('land-capture'); out.mkdir()
          url='https://content.kemet.com/datasheets/KEM_T2005_T491.pdf'
          row={'url':url,'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'file':'KEM_T2005_T491.pdf'}
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=response.read(8_000_001)
                  if len(data)>8_000_000 or not data.startswith(b'%PDF-'): raise ValueError('not a bounded PDF')
                  row.update(status=response.status,final_url=response.url,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              (out/row['file']).write_bytes(data)
          except Exception as exc:
              row['error']=type(exc).__name__+': '+str(exc)
          (out/'CAPTURE.json').write_text(json.dumps({'scope':'public_primary_source_not_assembly_approval','receipt':row},indent=2)+'\n')
          if 'error' in row: raise RuntimeError(row['error'])
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kemet-land-guidance
          path: land-capture/
          if-no-files-found: error
          retention-days: 14
