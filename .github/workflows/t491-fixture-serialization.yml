name: Disposable T491 fixture serialization
on:
  pull_request:
permissions:
  contents: read
jobs:
  serialize:
    if: github.head_ref == 'transport/t491-native-fixtures' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 544014eb6e0cc41be6014d12758a692b1888a4a3
          persist-credentials: false
      - name: Reconstruct exact captured fixture bytes and store only blob objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          out=pathlib.Path('serialization-receipt'); out.mkdir()
          root=pathlib.Path('tests/fixtures')
          xml=gzip.decompress((root/'rev_a_netlist.xml.gz').read_bytes()).decode('utf-8')
          changes=[
              ('/mnt/data/eeg-repo/','/mnt/data/current_work/repo/',2),
              ('2026-09-26T17:16:33+0000','2026-09-27T17:47:38+0000',1),
              ('<rev>A - REVIEW ONLY</rev>','<rev>A-DRAFT</rev>',3),
              ('Capacitor_Tantalum_SMD:CP_EIA-7343-31_Kemet-D','RevA_Passives:T491D_7343_DensityB',2),
              ('Capacitor_Tantalum_SMD:CP_EIA-3528-21_Kemet-B','RevA_Passives:T491B_3528_DensityB',2),
          ]
          for before,after,count in changes:
              assert xml.count(before)==count
              xml=xml.replace(before,after)
          raw=xml.encode('utf-8')
          assert hashlib.sha256(raw).hexdigest()=='ca9ccef463e1ab31426ae3afdc9744bd085a6b5bfde18fe231871228ce91fea2'
          compressed=bytearray(gzip.compress(raw,compresslevel=9,mtime=0)); compressed[9]=255
          csv=(root/'rev_a_bom.csv').read_bytes()
          for before,after,_ in changes[-2:]:
              assert csv.count(before.encode())==1
              csv=csv.replace(before.encode(),after.encode())
          assert hashlib.sha256(csv).hexdigest()=='87460b3c87d06f3ad077e5521f7b06665c0a19cd4e16f3d25169e1603e2c3c22'
          payloads=[('rev_a_netlist.xml.gz',bytes(compressed),'a1957d56b6d5db1f6f796066bf275a94d9f908df'),('rev_a_bom.csv',csv,'f33ae9a6afced50c2e84d1c3b87c1d1d21a625c5')]
          receipts=[]
          for name,data,expected in payloads:
              digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert digest==expected,(name,digest)
              body=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode()
              request=urllib.request.Request('https://api.github.com/repos/utof/eeg_ads1299_lab/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
              assert result['sha']==expected
              receipts.append({'file':name,'bytes':len(data),'git_blob_sha':digest,'sha256':hashlib.sha256(data).hexdigest()})
          (out/'BLOBS.json').write_text(json.dumps({'scope':'byte_serialization_only_not_native_execution','base_commit':'544014eb6e0cc41be6014d12758a692b1888a4a3','creates_commits_or_refs':False,'files':receipts},indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t491-serialization-receipt
          path: serialization-receipt/
          if-no-files-found: error
          retention-days: 14
