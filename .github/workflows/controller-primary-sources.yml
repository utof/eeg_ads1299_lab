name: Controller primary sources
on:
  push:
    branches: [workbench/controller-interface-source]
    paths: [.github/workflows/controller-primary-sources.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download original public manufacturer documents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          cd "$RUNNER_TEMP/sources"
          curl --fail --location --max-time 60 'https://ftdichip.com/wp-content/uploads/2020/10/DS_UMFT201_220_230XB.pdf' -o ftdi-xb.pdf
          curl --fail --location --max-time 60 'https://www.ti.com/lit/ds/symlink/iso7721.pdf' -o iso7721.pdf
          curl --fail --location --max-time 60 'https://dl.espressif.com/dl/schematics/SCH_ESP32-S3-DevKitC-1_V1.1_20221130.pdf' -o devkit-v11.pdf
          python3 - <<'PY'
          import pathlib,hashlib
          files=sorted(pathlib.Path('.').glob('*.pdf'))
          assert len(files)==3
          for p in files:
              assert p.read_bytes().startswith(b'%PDF-'),p
          pathlib.Path('SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: controller-primary-sources
          path: ${{ runner.temp }}/sources/
          retention-days: 7
          if-no-files-found: error
