name: Preserve K2 review corrections
on:
  push:
    branches: [workbench/carrier-k2]
    paths: [.github/workflows/k2-review-fixes.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify original incremental bundle before importing any source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,pathlib,subprocess
          encoded=''.join(pathlib.Path(f'transfer/k2fix{i}.b64').read_text().strip() for i in range(4))
          assert len(encoded)==10568
          data=base64.b64decode(encoded,validate=True)
          assert len(data)==7925
          assert hashlib.sha256(data).hexdigest()=='bea5410bad110f2b805cc63ffb655adc643734da4c3fb049c106cb110c1dabc1'
          p=pathlib.Path('/tmp/k2-review.bundle');p.write_bytes(data)
          subprocess.run(['git','bundle','verify',str(p)],check=True)
          subprocess.run(['git','fetch',str(p),'HEAD'],check=True)
          PY
          test "$(git rev-parse FETCH_HEAD)" = f9c06df8511324cc755cb358b8547d4c78cb8a3e
          test "$(git rev-parse FETCH_HEAD^{tree})" = eed25a06f3e4b63dabd4cf5260d6fae256d8b38b
          git merge-base --is-ancestor 5426bf1853134ec30ad9a614996e301167836711 FETCH_HEAD
          test "$(git rev-list --count 5426bf1..FETCH_HEAD)" = 5
          git diff --exit-code 5426bf1 FETCH_HEAD -- .github hardware/rev_a/layout hardware/rev_a/kicad hardware/rev_a/bom.json hardware/rev_a/board_profile.json firmware lab pyproject.toml uv.lock
          git push origin f9c06df8511324cc755cb358b8547d4c78cb8a3e:refs/heads/archive/carrier-k2-review-fixes
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: archive/carrier-k2-review-fixes
          fetch-depth: 0
          path: fresh
          persist-credentials: false
      - name: Independently verify original source retrieved from GitHub
        shell: bash
        run: |
          set -euo pipefail
          cd fresh
          test "$(git rev-parse HEAD)" = f9c06df8511324cc755cb358b8547d4c78cb8a3e
          test "$(git rev-parse HEAD^{tree})" = eed25a06f3e4b63dabd4cf5260d6fae256d8b38b
          printf '%s  %s\n' dfe893f958128ba28eb69188cf6debbbc9fcafa0ef5dd67bd58627d4b8a26842 hardware/rev_a/layout/rev_a.kicad_pcb | sha256sum -c -
          test -z "$(git status --porcelain)"
          git log -5 --oneline
          git rev-parse HEAD HEAD^{tree}
