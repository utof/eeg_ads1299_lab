name: Active capacitor candidate screen
on:
  push:
    branches: [workbench/capacitor-e1-source]
    paths: [.github/workflows/capacitor-e1-active.yml]
permissions: {}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read public catalog and retain bounded candidate rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/active-caps"
          export OUT="$RUNNER_TEMP/active-caps"
          python3 - <<'PY'
          import csv,datetime,hashlib,io,json,os,pathlib,urllib.request,zipfile
          out=pathlib.Path(os.environ['OUT'])
          def fetch(url,name=None):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=90) as r:
                  data=r.read(120_000_001); assert len(data)<=120_000_000
                  rec={'url':url,'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
              if name: (out/name).write_bytes(data)
              return data,rec
          data,catalog=fetch('https://ds.murata.com/simsurfing_data/data/mlcc.zip')
          keep=['part_number','public_part_number','channel_code','production_status_ja','production_status_en-us','production_status_zh-cn','L','W','size_thickness_max','LWSize_mm_inch','tempchar','rvol','tolerance','capacitance_pu','Condition','TC_Condition']
          groups={'one_uF':[],'hundred_nF':[]};csvs=[]
          z=zipfile.ZipFile(io.BytesIO(data))
          for name in z.namelist():
              if not name.lower().endswith('.csv'):continue
              raw=z.read(name);csvs.append({'name':name,'sha256':hashlib.sha256(raw).hexdigest()})
              for row in csv.DictReader(io.StringIO(raw.decode('utf-8-sig'))):
                  if not row.get('part_number','').startswith('GRM18'):continue
                  if row.get('production_status_en-us')!='B':continue
                  if row.get('tolerance')!='±10%':continue
                  if row.get('LWSize_mm_inch')!='1608M/0603':continue
                  group=None
                  if row.get('capacitance_pu')=='1μF' and row.get('rvol') in ['25','35','50'] and row.get('tempchar') in ['X5R','X7R']: group='one_uF'
                  if row.get('capacitance_pu')=='0.1μF' and row.get('rvol') in ['50','100'] and row.get('tempchar')=='X7R':group='hundred_nF'
                  if group:groups[group].append({k:row.get(k) for k in keep})
          assert all(len(rows)<100 for rows in groups.values())
          record={'catalog':catalog,'csv':csvs,'groups':groups,'pdfs':{},'errors':{}}
          for group,rows in groups.items():
              print(group,rows,flush=True)
              for row in rows[:4]:
                  core=row['part_number']
                  url='https://ds.murata.com/simserve/characteristics?ReqType=TechPDF&partnumber='+core+'&techpdfname=technical_pdf_Capacitor01&lang=en'
                  try:
                      data,rec=fetch(url,core+'.pdf');assert data.startswith(b'%PDF-')
                      record['pdfs'][core]=rec
                  except Exception as e:record['errors'][core]=str(e)
          (out/'active-candidates.json').write_text(json.dumps(record,indent=2,ensure_ascii=False)+'\n')
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.is_file()))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capacitor-e1-active
          path: ${{ runner.temp }}/active-caps/
          if-no-files-found: error
          retention-days: 7
