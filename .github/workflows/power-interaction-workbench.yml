name: Disposable power interaction workbench
on:
  pull_request:
    paths: ['.github/workflows/power-interaction-workbench.yml']
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.13'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing locked environment and native simulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ngspice
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
      - name: Run bounded enable-interaction controls
        run: |
          mkdir -p reports/interaction
          git archive --format=tar HEAD > reports/interaction/repository.tar
          cat > reports/interaction/experiment.py <<'PY'
          """Disposable interaction controls, not a proposed model repair."""
          import hashlib
          import json
          import re
          import subprocess
          import urllib.request
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import numpy as np

          from lab.analog import run_ngspice_transient
          from lab.rev_a_power import prepare_library, run_pilot

          root = Path('reports/interaction')
          results = []
          metadata = {}

          def probe(name, library, extra_nodes=()):
              path = root / name
              path.mkdir()
              nodes = ('in', 'en', 'out', *extra_nodes)
              text = (
                  'Independent enable interaction experiment; NOT VALIDATION\n'
                  f'.param V_out=3.3\n.include "{library}"\n'
                  'Vin in 0 PWL(0 0 1m 0 1.01m 5 20m 5)\n'
                  'Venable en 0 PWL(0 0 1m 0 1.01m 5 15m 5 15.01m 0 20m 0)\n'
                  'Xreg in 0 en nc out TPS7A20_ADJ_TRANS\n'
                  'Cin in 0 1u\nCout out 0 1u\nRnc nc 0 1e12\nRbase out 0 1100\n'
                  'Vload ctl 0 PWL(0 0 8m 0 8.01m 1 12m 1 12.01m 0 20m 0)\n'
                  'Bload out 0 I={v(out)*v(ctl)*(0.010-0.003)/3.3}\n'
                  '.options reltol=1e-5 abstol=1e-10 vntol=1e-7 method=gear\n'
                  '.control\nset wr_singlescale\nset wr_vecnames\nset numdgt=15\n'
                  'tran 1u 20m 0 1u\n'
                  'let integration_start = time[0]\n'
                  'let integration_stop = time[length(time)-1]\n'
                  'print integration_start integration_stop > transient-window.txt\n'
                  'wrdata transient.txt ' + ' '.join(f'v({n})' for n in nodes) +
                  '\nquit\n.endc\n.end\n'
              )
              (path / 'network.cir').write_text(text)
              init = path / '.spiceinit'
              init.write_text('set ngbehavior=psa\n')
              result = {'name': name, 'library_sha256': hashlib.sha256(library.read_bytes()).hexdigest(),
                        'nodes': nodes, 'window_complete': False, 'power_model_validated': False}
              try:
                  times, volts = run_ngspice_transient(path / 'network.cir', path,
                                                       columns=len(nodes), expected_stop_s=0.02)
                  result.update({'window_complete': True, 'last_time_s': float(times[-1]),
                                 'final_vout_v': float(volts[-1, 2]),
                                 'min_vout_v': float(np.min(volts[:, 2]))})
              except (RuntimeError, ValueError) as exc:
                  result['reason'] = str(exc)
              finally:
                  init.rename(path / 'spiceinit.txt')
              results.append(result)
              print(json.dumps(result))

          try:
              with TemporaryDirectory(prefix='private-ti-interaction-') as temporary:
                  private = Path(temporary)
                  archive = private / 'sbvm961.zip'
                  with urllib.request.urlopen('https://www.ti.com/lit/zip/sbvm961', timeout=30) as source:
                      archive.write_bytes(source.read(4_000_001))
                  raw = prepare_library(archive, normalize_switch=True)
                  base = raw.decode('latin-1')
                  statements = re.sub(r'\r?\n\s*\+', ' ', base).splitlines(keepends=True)
                  calls = [line for line in statements if re.match(r'^\s*X\S+\s', line, re.I)
                           and line.split()[-1].upper() == 'COMPHYS_BASIC_GEN']
                  metadata['comparator_calls'] = [line.split() for line in calls]
                  candidates = [line for line in calls if line.split()[1].upper() == 'EN']
                  if len(candidates) != 1:
                      raise ValueError(f'Expected exactly one EN comparator, found {len(candidates)}')
                  call = candidates[0]
                  tokens = call.split()
                  output = tokens[4]
                  metadata['enable_output'] = output
                  # Record only interface/connectivity metadata, never library implementation.
                  metadata['consumers'] = [
                      {'device': line.split()[0],
                       'voltage_dependencies': re.findall(r'V\(([^)]+)\)', line, re.I)}
                      for line in statements if line.strip() and not line.lstrip().startswith('*')
                      and line != call and re.search(r'(?<![\w])' + re.escape(output) + r'(?![\w])', line, re.I)
                  ]
                  joined = ''.join(statements)
                  library = private / 'baseline.lib'
                  library.write_bytes(raw)
                  probe('baseline', library, (f'xreg.{output}',))
                  # Algebraic unity buffering preserves DC gain but isolates port loading.
                  buffered = tokens.copy()
                  buffered[4] = 'probe_en_raw'
                  replacement = ' '.join(buffered) + '\nEprobe_buffer ' + output + ' 0 probe_en_raw 0 1\n'
                  library = private / 'buffered.lib'
                  library.write_bytes(joined.replace(call, replacement).encode('latin-1'))
                  probe('buffered', library, (f'xreg.{output}', 'xreg.probe_en_raw'))
                  # Prescribed transition controls deliberately remove hysteresis dynamics.
                  # They locate interactions; they are NOT equivalent model implementations.
                  for width in (1e-9, 1e-8, 1e-7, 1e-6):
                      rise = 0.00100189
                      fall = 0.01500821
                      replacement = (f'Vprobe_enable {output} 0 PWL(0 0 {rise:g} 0 '
                                     f'{rise+width:.12g} 1 {fall:g} 1 {fall+width:.12g} 0 20m 0)\n')
                      library = private / f'prescribed-{width:g}.lib'
                      library.write_bytes(joined.replace(call, replacement).encode('latin-1'))
                      probe(f'prescribed_{width:g}', library, (f'xreg.{output}',))
          finally:
              summary = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                         'results': results, 'metadata': metadata, 'hardware_validated': False,
                         'scope': 'counterfactual controls, not qualified model edits'}
              (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
              files = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                       for p in root.rglob('*') if p.is_file()}
              (root / 'manifest.json').write_text(json.dumps(files, indent=2) + '\n')
              print(json.dumps(summary, indent=2))
          PY
          uv run --locked python reports/interaction/experiment.py
      - name: Retain handwritten experiments and diagnostics, never private libraries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: power-interaction-workbench
          path: reports/interaction/
          if-no-files-found: error
          retention-days: 14
