name: Disposable power interaction workbench
on:
  pull_request:
    paths: ['.github/workflows/power-interaction-workbench.yml']
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.13'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing locked environment and native simulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ngspice
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
      - name: Reduce enable gate and downstream interaction
        run: |
          mkdir -p reports/interaction
          git archive --format=tar HEAD > reports/interaction/repository.tar
          cat > reports/interaction/experiment.py <<'PY'
          """Disposable counterfactual controls; NOT proposed model repairs."""
          import hashlib
          import json
          import re
          import subprocess
          import urllib.request
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import numpy as np

          from lab.analog import run_ngspice_transient
          from lab.rev_a_power import prepare_library

          root = Path('reports/interaction')
          results = []
          metadata = {}

          def execute(name, library, circuit, nodes):
              path = root / name
              path.mkdir()
              text = ('Independent interaction experiment; NOT VALIDATION\n'
                      f'.param V_out=3.3\n.include "{library}"\n' + circuit +
                      '.options reltol=1e-5 abstol=1e-10 vntol=1e-7 method=gear\n'
                      '.control\nset wr_singlescale\nset wr_vecnames\nset numdgt=15\n'
                      'tran 1u 20m 0 1u\n'
                      'let integration_start = time[0]\n'
                      'let integration_stop = time[length(time)-1]\n'
                      'print integration_start integration_stop > transient-window.txt\n'
                      'wrdata transient.txt ' + ' '.join(f'v({n})' for n in nodes) +
                      '\nquit\n.endc\n.end\n')
              (path / 'network.cir').write_text(text)
              init = path / '.spiceinit'
              init.write_text('set ngbehavior=psa\n')
              result = {'name': name, 'library_sha256': hashlib.sha256(library.read_bytes()).hexdigest(),
                        'nodes': nodes, 'window_complete': False, 'power_model_validated': False}
              try:
                  times, volts = run_ngspice_transient(path / 'network.cir', path,
                                                       columns=len(nodes), expected_stop_s=0.02)
                  result.update({'window_complete': True, 'last_time_s': float(times[-1]),
                                 'final_volts': volts[-1].tolist(),
                                 'min_volts': np.min(volts, axis=0).tolist(),
                                 'max_volts': np.max(volts, axis=0).tolist()})
              except (RuntimeError, ValueError) as exc:
                  result['reason'] = str(exc)
              finally:
                  init.rename(path / 'spiceinit.txt')
              results.append(result)
              print(json.dumps(result))

          def edge(width, amplitude=1.0, rise=0.00100189, fall=0.01500821):
              return (f'PWL(0 0 {rise:.12g} 0 {rise+width:.12g} {amplitude:.12g} '
                      f'{fall:.12g} {amplitude:.12g} {fall+width:.12g} 0 20m 0)')

          full = ('Vin in 0 PWL(0 0 1m 0 1.01m 5 20m 5)\n'
                  'Venable en 0 PWL(0 0 1m 0 1.01m 5 15m 5 15.01m 0 20m 0)\n'
                  'Xreg in 0 en nc out TPS7A20_ADJ_TRANS\n'
                  'Cin in 0 1u\nCout out 0 1u\nRnc nc 0 1e12\nRbase out 0 1100\n'
                  'Vload ctl 0 PWL(0 0 8m 0 8.01m 1 12m 1 12.01m 0 20m 0)\n'
                  'Bload out 0 I={v(out)*v(ctl)*(0.010-0.003)/3.3}\n')
          try:
              with TemporaryDirectory(prefix='private-ti-interaction-') as temporary:
                  private = Path(temporary)
                  archive = private / 'sbvm961.zip'
                  with urllib.request.urlopen('https://www.ti.com/lit/zip/sbvm961', timeout=30) as source:
                      archive.write_bytes(source.read(4_000_001))
                  original = prepare_library(archive, normalize_switch=False)
                  normalized = prepare_library(archive, normalize_switch=True)
                  statements = re.sub(r'\r?\n\s*\+', ' ', normalized.decode('latin-1')).splitlines(keepends=True)
                  signatures = {line.split()[1].upper(): line.split()[2:]
                                for line in statements if line.lstrip().upper().startswith('.SUBCKT ')}
                  matches = [line for line in statements if line.split() and line.split()[0] == 'X_U1_U4']
                  if len(matches) != 1:
                      raise ValueError('Expected previously observed X_U1_U4 consumer')
                  call = matches[0]
                  tokens = call.split()
                  model_index = next(i for i, token in enumerate(tokens) if token.upper() in signatures)
                  pins, model = tokens[1:model_index], tokens[model_index]
                  output = pins[-1]
                  metadata['gate_call'] = tokens
                  metadata['gate_signature'] = signatures[model.upper()]
                  metadata['output_consumers'] = [
                      {'device': line.split()[0],
                       'voltage_dependencies': re.findall(r'V\(([^)]+)\)', line, re.I)}
                      for line in statements if line.strip() and not line.lstrip().startswith('*')
                      and line != call and re.search(r'(?<![\w])' + re.escape(output) + r'(?![\w])', line, re.I)
                  ]
                  if 'U1_EN_PRE' not in pins[:-1]:
                      raise ValueError('Gate input contract changed')
                  joined = ''.join(statements)
                  library = private / 'normalized.lib'
                  library.write_bytes(normalized)
                  nodes = ('en', 'out', 'xreg.en_int', 'xreg.u1_en_pre', f'xreg.{output}')
                  execute('full_baseline', library, full, nodes)
                  library = private / 'format-only.lib'
                  library.write_bytes(joined.encode('latin-1'))
                  execute('full_format_only', library, full, nodes)
                  for width in (1e-9, 1e-7, 1e-6):
                      replacement = f'Vprobe_gate {output} 0 {edge(width)}\n'
                      library = private / f'gate-{width:g}.lib'
                      library.write_bytes(joined.replace(call, replacement).encode('latin-1'))
                      execute(f'full_prescribed_gate_{width:g}', library, full, nodes)
                  # Unmodified library helpers, externally driven and loaded.
                  library = private / 'original.lib'
                  library.write_bytes(original)
                  mapped = ['control' if pin == 'U1_EN_PRE' else 'high' for pin in pins[:-1]] + ['gateout']
                  instance = 'Xgate ' + ' '.join([*mapped, *tokens[model_index:]]) + '\n'
                  load = 'Vhigh high 0 1\nRload gateout 0 1meg\n'
                  for width in (1e-9, 1e-8, 1e-7, 1e-6):
                      circuit = f'Vcontrol control 0 {edge(width)}\n' + instance + load
                      execute(f'isolated_gate_{width:g}', library, circuit, ('control', 'gateout'))
                  circuit = ('Vsignal signal 0 ' + edge(1e-5, amplitude=5, rise=0.001, fall=0.015) + '\n'
                             'Vreference reference 0 0.92\nVhys hyst 0 0.025\n'
                             'Xcomp signal reference hyst control COMPHYS_BASIC_GEN PARAMS: VDD=1 VSS=0 VTHRESH=0.5\n'
                             + instance + load)
                  execute('isolated_comparator_and_gate', library, circuit, ('signal', 'control', 'gateout'))
          finally:
              summary = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                         'results': results, 'metadata': metadata, 'hardware_validated': False,
                         'scope': 'counterfactual controls, not qualified model edits'}
              (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
              files = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                       for p in root.rglob('*') if p.is_file()}
              (root / 'manifest.json').write_text(json.dumps(files, indent=2) + '\n')
              print(json.dumps(summary, indent=2))
          PY
          uv run --locked python reports/interaction/experiment.py
      - name: Retain handwritten experiments and diagnostics, never private libraries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: power-interaction-workbench
          path: reports/interaction/
          if-no-files-found: error
          retention-days: 14
