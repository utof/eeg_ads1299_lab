name: Session snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'chore/session-source-snapshot'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cdd901d5df8375e71eadefc99bdacc1056843410
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare exact source and offline locked cache
        env:
          UV_CACHE_DIR: /tmp/session-cache
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
          uv run --locked python -m tools.check
          mkdir -p /tmp/session-export
          git bundle create /tmp/session-export/source.bundle --all
          git archive --format=tar.gz HEAD > /tmp/session-export/source.tar.gz
          tar -C /tmp -czf /tmp/session-export/uv-cache.tar.gz session-cache
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ngspice
          cp /usr/bin/ngspice /tmp/session-export/ngspice
          ngspice --version > /tmp/session-export/ngspice-version.txt
          ldd /usr/bin/ngspice > /tmp/session-export/ngspice-libraries.txt
          sha256sum /tmp/session-export/* > /tmp/session-export/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-session-snapshot
          path: /tmp/session-export/
          retention-days: 3
          if-no-files-found: error
