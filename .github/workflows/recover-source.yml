name: Recover source
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'chore/recover-source-sep26'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fac77af2111814462b8aa50598cecfe0a274a300
          persist-credentials: false
          fetch-depth: 0
      - name: Export exact source history without credentials
        run: |
          mkdir -p /tmp/recovery-source
          git bundle create /tmp/recovery-source/source.bundle --all
          git rev-parse HEAD HEAD^{tree} > /tmp/recovery-source/SOURCE.txt
          cd /tmp/recovery-source
          sha256sum source.bundle SOURCE.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovered-source
          path: /tmp/recovery-source/
          retention-days: 3
          if-no-files-found: error
