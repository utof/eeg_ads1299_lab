name: Firmware
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  s3:
    name: ESP32-S3 target compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: '3.13'
      UV_PYTHON_DOWNLOADS: never
      MPLBACKEND: Agg
      TERM: dumb
      ARDUINO_DIRECTORIES_DATA: ${{ runner.temp }}/arduino-data
      ARDUINO_DIRECTORIES_DOWNLOADS: ${{ runner.temp }}/arduino-downloads
      ARDUINO_DIRECTORIES_USER: ${{ runner.temp }}/arduino-user
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-locked Arduino CLI
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          config = json.loads(pathlib.Path('firmware/toolchain.json').read_text())
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'arduino-cli-install'
          root.mkdir()
          package = root / 'cli.deb'
          with urllib.request.urlopen(config['cli_linux_amd64_deb_url'], timeout=120) as response:
              package.write_bytes(response.read())
          assert hashlib.sha256(package.read_bytes()).hexdigest() == config['cli_linux_amd64_deb_sha256']
          subprocess.run(['dpkg-deb', '--extract', str(package), str(root / 'unpacked')], check=True)
          executable = root / 'unpacked/usr/bin/arduino-cli'
          assert executable.is_file()
          with open(os.environ['GITHUB_PATH'], 'a') as path:
              path.write(str(executable.parent) + '\n')
          PY
      - name: Install pinned ESP32 core
        run: |
          INDEX=$(python -c 'import json; print(json.load(open("firmware/toolchain.json"))["index_url"])')
          CORE=$(python -c 'import json; c=json.load(open("firmware/toolchain.json")); print(c["core"]+"@"+c["core_version"])')
          arduino-cli core update-index --additional-urls "$INDEX"
          arduino-cli core install "$CORE" --additional-urls "$INDEX"
      - name: Install locked Python environment
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
      - name: Run shared quality and actual target compile
        run: uv run --locked python -m tools.check --firmware --out reports/firmware
      - name: Verify tracked source was not modified
        if: always()
        run: git diff --exit-code HEAD
      - name: Retain target compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: esp32-s3-target-build
          path: reports/firmware/
          if-no-files-found: warn
          retention-days: 14
