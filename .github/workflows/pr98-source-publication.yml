name: Publish verified PR98 source only
on:
  push:
    branches: [workbench/pr98-source-publication-20261010]
    paths: [.github/workflows/pr98-source-publication.yml]
permissions:
  contents: write
jobs:
  publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 08a8ddd036b891af9fac59b83755ba173bdd6611
          fetch-depth: 0
      - name: Verify immutable patch and publish only its eleven source files
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib, subprocess, tempfile
          START = '08a8ddd036b891af9fac59b83755ba173bdd6611'
          START_TREE = 'a1c5f1f4db0eb9c8eec0eb370950bd0522b1a5aa'
          BASE = 'ff953c03c452f1572602b52aa62f42e80bfa9588'
          HISTORICAL_TREE = '2e50d2bdd9f25f6cc74e0294d8015a822dda50f2'
          DEST = 'refs/heads/workbench/pr98-applied-source-20261010'
          EXPECTED = {
              'docs/HARDWARE_BASELINE_REV_A.md',
              'hardware/rev_a/auxiliary.py',
              'hardware/rev_a/auxiliary/auxiliary.kicad_pcb',
              'hardware/rev_a/auxiliary/bus.kicad_sch',
              'hardware/rev_a/auxiliary/contract.json',
              'hardware/rev_a/bom.json',
              'hardware/rev_a/check_baseline.py',
              'hardware/rev_a/check_schematic.py',
              'hardware/rev_a/kicad/digital.kicad_sch',
              'hardware/rev_a/layout/rev_a.kicad_pcb',
              'tests/test_spi_series_population.py',
          }
          def git(*args, env=None):
              return subprocess.check_output(['git', *args], env=env, timeout=90).decode().strip()
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          assert git('rev-parse', 'HEAD') == START
          assert git('rev-parse', 'HEAD^{tree}') == START_TREE
          assert not git('status', '--porcelain', '--untracked-files=all')
          assert git('ls-remote', 'origin', 'refs/heads/work/l5-spi-series').split()[0] == START
          assert not git('ls-remote', 'origin', DEST), 'publication destination already exists'
          root = pathlib.Path('docs/recovery/l5_spi_candidate_20261008')
          manifest_bytes = (root / 'manifest.json').read_bytes()
          assert sha(manifest_bytes) == 'd98e072d332b26528bf1c8349e796652aa61b27a23f56e7ef763086d6aa48014'
          m = json.loads(manifest_bytes)
          assert m['repository'] == 'utof/eeg_ads1299_lab' and m['pr'] == 98
          assert m['base_commit'] == BASE
          assert m['base_tree'] == '928e94437784b2249042555e1fa17316406dfc41'
          assert git('rev-parse', BASE + '^{tree}') == m['base_tree']
          assert m['expected_full_tree_if_applied_to_exact_base'] == HISTORICAL_TREE
          assert set(m['candidate_files']) == EXPECTED and len(EXPECTED) == 11
          assert [x['path'] for x in m['parts']] == ['patch.gz.01', 'patch.gz.02', 'patch.gz.03']
          chunks = []
          for entry in m['parts']:
              data = (root / entry['path']).read_bytes()
              assert len(data) == entry['bytes'] and sha(data) == entry['sha256']
              assert blob(data) == entry['blob']
              chunks.append(data)
          packed = b''.join(chunks)
          assert len(packed) == 13641
          assert sha(packed) == 'e25c9afc67f986a25c8e2105b2ad9d492aee2d0e07979088386a6432328a45de'
          patch = gzip.decompress(packed)
          assert len(patch) == 17807
          assert sha(patch) == 'e02e30f380146e5d131b9a63c78d9e80f5e2d165bf7e36d3fea0c4b61aeed776'
          tmp = pathlib.Path(tempfile.mkdtemp(prefix='pr98-source-', dir=os.environ['RUNNER_TEMP']))
          patch_path = tmp / 'candidate.patch'
          patch_path.write_bytes(patch)
          for name, entry in m['candidate_files'].items():
              listed = git('ls-tree', START, '--', name)
              if entry['base_blob'] is None:
                  assert not listed, 'newer source conflicts with candidate: ' + name
              else:
                  assert listed.split()[0:3] == ['100644', 'blob', entry['base_blob']], name
          def apply_to_index(ref, index_name):
              env = dict(os.environ, GIT_INDEX_FILE=str(tmp / index_name))
              git('read-tree', ref, env=env)
              git('apply', '--cached', '--check', str(patch_path), env=env)
              git('apply', '--cached', str(patch_path), env=env)
              tree = git('write-tree', env=env)
              changed = set(git('diff', '--name-only', ref, tree).splitlines())
              assert changed == EXPECTED, changed
              for name, entry in m['candidate_files'].items():
                  assert git('ls-tree', tree, '--', name).split()[0:3] == ['100644', 'blob', entry['candidate_blob']], name
                  data = subprocess.check_output(['git', 'show', tree + ':' + name], timeout=30)
                  assert sha(data) == entry['candidate_sha256'], name
              return tree
          assert apply_to_index(BASE, 'historical.index') == HISTORICAL_TREE
          tree = apply_to_index(START, 'current.index')
          assert git('rev-parse', tree + ':.github') == git('rev-parse', START + ':.github')
          assert git('rev-parse', tree + ':firmware') == git('rev-parse', START + ':firmware')
          assert git('rev-parse', tree + ':docs/quote') == git('rev-parse', START + ':docs/quote')
          env = dict(os.environ, GIT_AUTHOR_NAME='utof', GIT_COMMITTER_NAME='utof',
                     GIT_AUTHOR_EMAIL='38869938+utof@users.noreply.github.com',
                     GIT_COMMITTER_EMAIL='38869938+utof@users.noreply.github.com')
          message = ('feat(hardware): apply the preserved five-position SPI source candidate\n\n'
                     'Apply exactly eleven manifest-verified files on 08a8ddd0, retaining\n'
                     'all later DNP, preservation, selection and native-fault test repairs.\n'
                     'The historical patch reproduces 2e50d2b; no geometry is recreated.\n'
                     'Five positions remain DNP/NOT_SELECTED. Native exports and copper\n'
                     'fills are not refreshed here. This is source publication only, not\n'
                     'a passing gate, approved damping value or fabrication release.\n'
                     'No workflow, firmware, Q1, dependency or permission setting changes\n'
                     'are included in this engineering commit. No project code executed\n'
                     'by the isolated source publisher. PR98 must remain draft.\n')
          head = git('commit-tree', tree, '-p', START, '-m', message, env=env)
          assert git('rev-parse', head + '^') == START
          assert git('ls-remote', 'origin', 'refs/heads/work/l5-spi-series').split()[0] == START
          git('push', 'origin', head + ':' + DEST)
          assert git('ls-remote', 'origin', DEST).split()[0] == head
          fresh = tmp / 'fresh'
          subprocess.run(['git', 'clone', '--no-local', '--branch', DEST.removeprefix('refs/heads/'),
                          'https://github.com/utof/eeg_ads1299_lab.git', str(fresh)], check=True, timeout=120)
          assert git('-C', str(fresh), 'rev-parse', 'HEAD') == head
          assert git('-C', str(fresh), 'rev-parse', 'HEAD^{tree}') == tree
          assert not git('-C', str(fresh), 'status', '--porcelain', '--untracked-files=all')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr98-source-receipt'
          out.mkdir()
          receipt = {'source_start': START, 'source_start_tree': START_TREE,
                     'historical_candidate_tree': HISTORICAL_TREE, 'published_head': head,
                     'published_tree': tree, 'destination': DEST, 'changed_files': sorted(EXPECTED),
                     'manifest_sha256': sha(manifest_bytes), 'patch_sha256': sha(patch),
                     'candidate_files': m['candidate_files'], 'independent_clone_verified': True,
                     'native_validation_performed': False, 'hardware_released': False}
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          subprocess.run(['git', '-C', str(fresh), 'archive', '--format=tar.gz',
                          '--output=' + str(out / 'source.tar.gz'), 'HEAD'], check=True, timeout=90)
          subprocess.run(['git', '-C', str(fresh), 'bundle', 'create', str(out / 'source.bundle'),
                          DEST], check=True, timeout=90)
          (out / 'SHA256SUMS').write_text(''.join(sha(p.read_bytes()) + '  ' + p.name + '\n'
                                                for p in sorted(out.iterdir()) if p.is_file()))
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr98-verified-source-publication
          path: ${{ runner.temp }}/pr98-source-receipt/
          retention-days: 14
          if-no-files-found: error
