name: DX recovery (temporary)
on:
  push:
    branches: [dx/tooling-bootstrap]
permissions:
  contents: read
concurrency:
  group: dx-bootstrap
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Inspect available source without executing it
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, re, subprocess, zlib
          base = 'b1c8e82b084f2fb2408fb0f8df27ff354586742b'
          decoder = lzma.LZMADecompressor()
          raw = b''
          for path in sorted(pathlib.Path('.dx-transfer').glob('part-*.b64')):
              encoded = path.read_text().strip()
              print('PART', path.name, len(encoded), hashlib.sha256(encoded.encode()).hexdigest())
              raw += decoder.decompress(base64.b64decode(encoded, validate=True))
          print('RECOVERED_JSON_BYTES', len(raw), 'COMPLETE_XZ', decoder.eof)
          text = raw.decode('utf-8')
          print('HEADER', text[:180])
          jd = json.JSONDecoder()
          recovered = []
          for match in re.finditer(r'\{"path":', text):
              try:
                  entry, consumed = jd.raw_decode(text[match.start():])
              except json.JSONDecodeError:
                  print('INCOMPLETE_ENTRY', text[match.start():match.start()+210])
                  break
              name = entry['path']
              prior = subprocess.run(['git','show',base+':'+name], capture_output=True, check=False)
              old = prior.stdout if prior.returncode == 0 else b''
              assert hashlib.sha256(old).hexdigest() == entry['old'], ('old hash', name)
              if entry.get('delete'):
                  print('DELETE', name)
              else:
                  zd = zlib.decompressobj(zdict=old[-32768:])
                  new = zd.decompress(base64.b64decode(entry['data'], validate=True)) + zd.flush()
                  assert zd.eof and hashlib.sha256(new).hexdigest() == entry['sha256'], ('new hash', name)
                  print('RECOVERED', name, len(new), entry['sha256'])
              recovered.append(name)
          print('TOTAL_COMPLETE_ENTRIES', len(recovered))
          print('MESSAGES', re.findall(r'"message":"([^"\\]*)"', text))
          print('UNPARSED_TAIL_BYTES', len(text) - (match.start() if 'match' in locals() else 0))
          PY
