name: DX bootstrap (temporary)
on:
  push:
    branches: [dx/tooling-bootstrap]
permissions:
  contents: read
concurrency:
  group: dx-bootstrap
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Resolve compatible static typing dependencies
        shell: bash
        run: |
          mkdir -p dx-lock/wheels
          python -m pip install uv==0.12.18
          uv add --project dx-bootstrap-project --dev --no-sync scipy-stubs==1.17.0.0
          uv export --project dx-bootstrap-project --locked --all-extras --no-emit-project --no-hashes > dx-lock/requirements.txt
          cp dx-bootstrap-project/uv.lock dx-lock/uv.lock
          cp dx-bootstrap-project/pyproject.toml dx-lock/pyproject.toml
          grep -E '^(scipy-stubs|optype|numpy-typing-compat|typing-extensions)==' dx-lock/requirements.txt > dx-lock/typing-requirements.txt
          python -m pip download --no-deps --only-binary=:all: --dest dx-lock/wheels -r dx-lock/typing-requirements.txt
          sha256sum dx-lock/uv.lock dx-lock/wheels/* > dx-lock/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dx-lock-scipy
          path: dx-lock/
          if-no-files-found: error
          retention-days: 1
