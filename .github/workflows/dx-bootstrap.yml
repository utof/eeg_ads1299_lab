name: DX recovery audit (temporary)
on:
  push:
    branches: [dx/tooling-bootstrap]
permissions:
  contents: read
concurrency:
  group: dx-recovery-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: b374c349b0145bac65ef3b7b53cdadad9fe72539
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.18
      - run: uv sync --locked --all-extras
      - name: Record failing checks before finishing recovered source
        shell: bash
        run: |
          mkdir -p reports/recovery-red
          python - <<'PY'
          import pathlib, subprocess
          failed = False
          commands = [
              ('lint', ['uv','run','--locked','ruff','check','.']),
              ('types', ['uv','run','--locked','pyrefly','check']),
              ('complexity', ['uv','run','--locked','complexipy','--failed']),
              ('architecture', ['uv','run','--locked','tach','check']),
              ('tests', ['uv','run','--locked','python','-m','pytest','-q']),
          ]
          for name, command in commands:
              proc = subprocess.run(command, text=True, capture_output=True, timeout=240, check=False)
              text = proc.stdout + '\n' + proc.stderr
              pathlib.Path('reports/recovery-red',name+'.log').write_text(text)
              print(f'=== {name}: exit {proc.returncode} ===\n{text}')
              failed |= bool(proc.returncode)
          raise SystemExit(int(failed))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dx-recovery-red
          path: reports/recovery-red/
          if-no-files-found: warn
          retention-days: 7
