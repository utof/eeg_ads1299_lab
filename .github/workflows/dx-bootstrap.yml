name: DX bootstrap (temporary)
on:
  push:
    branches: [dx/tooling-bootstrap]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Collect exact source and public dependency wheels
        run: |
          mkdir -p dx-bootstrap/wheels
          git archive --format=tar b1c8e82b084f2fb2408fb0f8df27ff354586742b > dx-bootstrap/source.tar
          python -m pip download --only-binary=:all: --dest dx-bootstrap/wheels ruff pyrefly complexipy tach hypothesis pre-commit pytest pytest-cov uv hatchling build types-pyserial scipy-stubs
          sha256sum dx-bootstrap/source.tar dx-bootstrap/wheels/* > dx-bootstrap/SHA256SUMS.txt
          python --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dx-bootstrap
          path: dx-bootstrap/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
