name: Mechanical primary references
on:
  push:
    branches: [workbench/mechanical-envelope]
    paths: [.github/workflows/mechanical-primary.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Capture public primary sources with exact byte identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/references"
          export CAPTURE_DIR="$RUNNER_TEMP/references"
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, urllib.request
          root=pathlib.Path(os.environ['CAPTURE_DIR'])
          urls={
              'tsw-catalog.pdf':'https://suddendocs.samtec.com/catalog_english/tsw_th.pdf',
              'tsw-drawing.pdf':'https://suddendocs.samtec.com/prints/tsw-xxx-xx-xxx-x-xx-xxx-mkt.pdf',
              'tsw-footprint.pdf':'https://suddendocs.samtec.com/prints/tsw-xxx-xx-x-x-xx-xxx-footprint.pdf',
              'ssw-catalog.pdf':'https://suddendocs.samtec.com/catalog_english/ssw_th.pdf',
              'ssw-drawing.pdf':'https://suddendocs.samtec.com/prints/ssw-1xx-xx-xxx-x-xx-xxx-xx-mkt.pdf',
              'tsw-ssw-spec.pdf':'https://suddendocs.samtec.com/productspecs/tsw-sxx.pdf',
              'ads1299.pdf':'https://www.ti.com/lit/ds/symlink/ads1299.pdf',
              't491.pdf':'https://content.kemet.com/datasheets/KEM_T2005_T491.pdf',
          }
          rows=[]
          for name,url in urls.items():
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=40) as response:
                  data=response.read(12000000)
                  assert data.startswith(b'%PDF-') and len(data)<12000000
                  final=response.url
              (root/name).write_bytes(data)
              rows.append({'name':name,'url':url,'final_url':final,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'capture_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()})
          (root/'manifest.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mechanical-primary-references
          path: ${{ runner.temp }}/references/
          if-no-files-found: error
          retention-days: 7
