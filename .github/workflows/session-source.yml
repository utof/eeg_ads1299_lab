name: Session source
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'chore/session-20260925-source'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: c8dda8834c1cac722c875517b5d65a5d362dced4
          persist-credentials: false
          fetch-depth: 0
      - name: Export source and bounded primary-source downloads
        run: |
          mkdir -p /tmp/session-source
          git bundle create /tmp/session-source/source.bundle --all
          git archive --format=tar.gz HEAD > /tmp/session-source/source.tar.gz
          curl -fL --max-time 45 https://www.ti.com/lit/ds/symlink/ads1299.pdf -o /tmp/session-source/ads1299.pdf
          curl -fL --max-time 45 https://www.ti.com/lit/zip/sbvm961 -o /tmp/session-source/sbvm961.zip || true
          sha256sum /tmp/session-source/* > /tmp/session-source/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-source
          path: /tmp/session-source/
          retention-days: 3
          if-no-files-found: error
