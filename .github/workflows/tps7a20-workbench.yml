name: Disposable TPS7A20 workbench
on:
  pull_request:
    paths: ['.github/workflows/tps7a20-workbench.yml']
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.13'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing locked environment and simulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ngspice
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
      - name: Perturb enable timing and capacitor separately
        run: |
          mkdir -p reports/workbench
          git archive --format=tar HEAD > reports/workbench/repository.tar
          cat > reports/workbench/experiment.py <<'PY'
          """Disposable control experiment; neither a model repair nor a qualification."""
          import hashlib
          import json
          import subprocess
          import urllib.request
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import numpy as np

          from lab.rev_a_power import _run, _vendor_netlist, prepare_library

          root = Path('reports/workbench')
          results = []
          with TemporaryDirectory(prefix='private-ti-workbench-') as temporary:
              private = Path(temporary)
              archive = private / 'sbvm961.zip'
              with urllib.request.urlopen('https://www.ti.com/lit/zip/sbvm961', timeout=30) as source:
                  raw = source.read(4_000_001)
              archive.write_bytes(raw)
              library = private / 'normalized.lib'
              library.write_bytes(prepare_library(archive, normalize_switch=True))
              base = _vendor_netlist(library, False, True)
              for name, fall_at, fall_duration, capacitor, method in (
                  ('control', 0.015, 10e-6, 'Cout out 0 1u', 'gear'),
                  ('fast_enable', 0.015, 1e-6, 'Cout out 0 1u', 'gear'),
                  ('slow_enable', 0.015, 100e-6, 'Cout out 0 1u', 'gear'),
                  ('earlier_enable', 0.005, 10e-6, 'Cout out 0 1u', 'gear'),
                  ('no_output_cap', 0.015, 10e-6, '* no output capacitor: diagnostic only', 'gear'),
                  ('cap_1nf', 0.015, 10e-6, 'Cout out 0 1n', 'gear'),
                  ('cap_10uf', 0.015, 10e-6, 'Cout out 0 10u', 'gear'),
                  ('esr_0p1', 0.015, 10e-6, 'Resr out cap 0.1\nCout cap 0 1u', 'gear'),
                  ('esr_1', 0.015, 10e-6, 'Resr out cap 1\nCout cap 0 1u', 'gear'),
                  ('trapezoidal', 0.015, 10e-6, 'Cout out 0 1u', 'trap'),
              ):
                  enable = f'PWL(0 0 1m 0 1.01m 5 {fall_at:.12g} 5 {fall_at+fall_duration:.12g} 0 20m 0)'
                  text = base.replace('Xreg in 0 in nc out', 'Venable en 0 ' + enable + '\nXreg in 0 en nc out')
                  text = text.replace('Cout out 0 1u', capacitor).replace('method=gear', 'method=' + method)
                  text = text.replace('v(in) v(out)', 'v(in) v(en) v(out)')
                  result = {'case': name, 'library_edited': True, 'power_model_validated': False,
                            'enable_fall_start_s': fall_at, 'enable_fall_duration_s': fall_duration}
                  path = root / name
                  try:
                      times, volts = _run(path, text, 3, expected_stop_s=0.02)
                      result.update({'completed': True, 'last_time_s': float(times[-1]), 'rows': len(times),
                                     'final_output_v': float(volts[-1, -1]),
                                     'min_output_v': float(np.min(volts[:, -1])),
                                     'max_output_v': float(np.max(volts[:, -1]))})
                  except (RuntimeError, ValueError) as exc:
                      result.update({'completed': False, 'reason': str(exc)})
                      output = path / 'transient.txt'
                      if output.exists():
                          partial = np.loadtxt(output, skiprows=1, ndmin=2)
                          if partial.ndim == 2 and partial.shape[1] == 4 and np.all(np.isfinite(partial)):
                              result['diagnostic_partial_only'] = {
                                  'last_time_s': float(partial[-1, 0]), 'vin_v': float(partial[-1, 1]),
                                  'ven_v': float(partial[-1, 2]), 'vout_v': float(partial[-1, 3])}
                  results.append(result)
          summary = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'results': results, 'hardware_validated': False,
                     'scope': 'one-factor perturbations; no model repair or reference-engine equivalence'}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          files = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in root.rglob('*') if p.is_file()}
          (root / 'manifest.json').write_text(json.dumps(files, indent=2) + '\n')
          PY
          uv run --locked python reports/workbench/experiment.py
      - name: Preserve handwritten fixtures and diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tps7a20-disposable-workbench
          path: reports/workbench/
          if-no-files-found: error
          retention-days: 14
