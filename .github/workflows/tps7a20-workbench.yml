name: Disposable TPS7A20 workbench
on:
  pull_request:
    paths: ['.github/workflows/tps7a20-workbench.yml']
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.13'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing locked environment and simulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ngspice
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
      - name: Test the actual four-pin comparator interface in isolation
        run: |
          mkdir -p reports/workbench
          cat > reports/workbench/experiment.py <<'PY'
          """Black-box helper stimulus, not a regulator or an edited vendor model."""
          import hashlib
          import json
          import subprocess
          import urllib.request
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import numpy as np
          from lab.rev_a_power import _run, prepare_library

          root = Path('reports/workbench')
          results = []
          with TemporaryDirectory(prefix='private-ti-workbench-') as temporary:
              private = Path(temporary)
              archive = private / 'sbvm961.zip'
              with urllib.request.urlopen('https://www.ti.com/lit/zip/sbvm961', timeout=30) as source:
                  archive.write_bytes(source.read(4_000_001))
              raw = prepare_library(archive, normalize_switch=False)
              library = private / 'original.lib'
              library.write_bytes(raw)
              for name, reference, hysteresis, falling in (
                  ('as_used_enable', 0.92, 0.025, True),
                  ('rise_only', 0.92, 0.025, False),
                  ('zero_hysteresis', 0.92, 0.0, True),
                  ('shifted_reference', 0.5, 0.025, True),
                  ('smaller_hysteresis', 0.92, 0.01, True),
              ):
                  wave = 'PWL(0 0 1m 0 1.01m 5 15m 5 15.01m 0 20m 0)' if falling else 'PWL(0 0 1m 0 1.01m 5 20m 5)'
                  text = (
                      'Independent isolated comparator fixture; not a regulator model\n'
                      f'.param V_out=3.3\n.include "{library}"\n'
                      f'Vsignal inp 0 {wave}\nVref inm 0 {reference:g}\nVhys hys 0 {hysteresis:g}\n'
                      'Xprobe inp inm hys out COMPHYS_BASIC_GEN\nRload out 0 1meg\n'
                      '.options reltol=1e-5 abstol=1e-10 vntol=1e-7 method=gear\n'
                      '.control\nset wr_singlescale\nset wr_vecnames\nset numdgt=15\n'
                      'tran 1u 20m 0 1u\nlet integration_start = time[0]\n'
                      'let integration_stop = time[length(time)-1]\n'
                      'print integration_start integration_stop > transient-window.txt\n'
                      'wrdata transient.txt v(inp) v(out)\nquit\n.endc\n.end\n'
                  )
                  result = {'case': name, 'reference_v': reference, 'hysteresis_v': hysteresis,
                            'power_model_validated': False, 'library_edited': False}
                  path = root / name
                  try:
                      times, volts = _run(path, text, 2, expected_stop_s=0.02)
                      result.update({'completed': True, 'last_time_s': float(times[-1]),
                                     'final_output_v': float(volts[-1, -1]),
                                     'max_output_v': float(np.max(volts[:, -1]))})
                  except (RuntimeError, ValueError) as exc:
                      result.update({'completed': False, 'reason': str(exc)})
                      output = path / 'transient.txt'
                      if output.exists():
                          partial = np.loadtxt(output, skiprows=1, ndmin=2)
                          if partial.ndim == 2 and partial.shape[1] == 3 and np.all(np.isfinite(partial)):
                              result['diagnostic_partial_only'] = {'last_time_s': float(partial[-1, 0]),
                                  'input_v': float(partial[-1, 1]), 'output_v': float(partial[-1, 2])}
                  results.append(result)
          summary = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'ngspice_version': subprocess.check_output(['ngspice', '--version'], text=True),
                     'library_sha256': hashlib.sha256(raw).hexdigest(), 'library_edited': False,
                     'results': results, 'hardware_validated': False,
                     'scope': 'isolated four-pin helper; no vendor implementation retained'}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          files = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root / 'manifest.json').write_text(json.dumps(files, indent=2) + '\n')
          PY
          uv run --locked python reports/workbench/experiment.py
      - name: Preserve handwritten stimuli and diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tps7a20-disposable-workbench
          path: reports/workbench/
          if-no-files-found: error
          retention-days: 14
