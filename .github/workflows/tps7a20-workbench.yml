name: Disposable TPS7A20 workbench
on:
  pull_request:
    paths: ['.github/workflows/tps7a20-workbench.yml']
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.13'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 644f86b6684667416a42e29b400e2ed9eea0653d
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing locked environment and simulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ngspice
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
      - name: Run the unchanged public pilot from the exact candidate
        run: |
          mkdir -p reports/workbench
          git archive --format=tar HEAD > reports/workbench/repository.tar
          cat > reports/workbench/experiment.py <<'PY'
          """Exact-candidate optional TI investigation, never model qualification."""
          import hashlib
          import json
          import subprocess
          import urllib.request
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from lab.rev_a_power import run_pilot

          root = Path('reports/workbench')
          results = []
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == '644f86b6684667416a42e29b400e2ed9eea0653d'
          with TemporaryDirectory(prefix='private-ti-workbench-') as temporary:
              archive = Path(temporary) / 'sbvm961.zip'
              with urllib.request.urlopen('https://www.ti.com/lit/zip/sbvm961', timeout=30) as source:
                  archive.write_bytes(source.read(4_000_001))
              for normalized in (False, True):
                  output = run_pilot(root / ('normalized' if normalized else 'original'),
                                     vendor_archive=archive, normalize_switch=normalized)
                  report = json.loads((output / 'pilot.json').read_text())
                  results.append({'path': str(output.relative_to(root)),
                                  'library_edited': normalized,
                                  'switch_execution_complete': report['switch_execution_complete'],
                                  'vendor_probes': report['vendor_probes']})
          summary = {'source_commit': commit, 'results': results,
                     'model_source_sha256': hashlib.sha256(Path('lab/rev_a_power.py').read_bytes()).hexdigest(),
                     'hardware_validated': False,
                     'scope': 'exact production candidate, optional original and normalized model controls'}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          assert not list(root.rglob('*.lib'))
          files = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root / 'manifest.json').write_text(json.dumps(files, indent=2) + '\n')
          PY
          uv run --locked python reports/workbench/experiment.py
      - name: Preserve source snapshot, handwritten stimuli and diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tps7a20-disposable-workbench
          path: reports/workbench/
          if-no-files-found: error
          retention-days: 14
