name: Disposable schematic review source export
on:
  pull_request:
permissions:
  contents: read
jobs:
  export:
    if: github.head_ref == 'workbench/kicad-runtime-20260926' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 970ccbd914758f87edf71d932fb73e05570a5422
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tree and retain repository bundle
        run: |
          test "$(git rev-parse HEAD)" = 970ccbd914758f87edf71d932fb73e05570a5422
          test "$(git rev-parse HEAD^{tree})" = c36f21d04aa9130436a5ff44f3b06630f8927aec
          mkdir -p /tmp/schematic-source
          git bundle create /tmp/schematic-source/source.bundle --all HEAD
          git rev-parse HEAD HEAD^{tree} > /tmp/schematic-source/SOURCE.txt
          sha256sum /tmp/schematic-source/source.bundle > /tmp/schematic-source/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schematic-review-source
          path: /tmp/schematic-source/
          if-no-files-found: error
          retention-days: 7
