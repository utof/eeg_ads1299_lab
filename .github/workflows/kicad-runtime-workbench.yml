name: Disposable KiCad runtime export
on:
  pull_request:
permissions:
  contents: read
jobs:
  export:
    if: github.head_ref == 'workbench/kicad-runtime-20260926'
    runs-on: ubuntu-24.04
    container: debian:trixie@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    timeout-minutes: 15
    steps:
      - name: Install exact distribution schematic engine
        run: |
          apt-get update -qq
          apt-get install --yes --no-install-recommends ca-certificates git python3 kicad=9.0.2+dfsg-1 kicad-symbols=9.0.2-1 kicad-footprints=9.0.2-1 > /tmp/install.log 2>&1 || { tail -60 /tmp/install.log; exit 1; }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Export engine, dependencies and selected footprint libraries
        run: |
          mkdir -p /tmp/kicad-export/bin /tmp/kicad-export/lib /tmp/kicad-export/footprints /tmp/kicad-out
          python3 - <<'PY'
          import pathlib, re, shutil, subprocess
          root=pathlib.Path('/tmp/kicad-export')
          files=subprocess.check_output(['dpkg','-L','kicad'],text=True).splitlines()
          engines={pathlib.Path(p).resolve() for p in files if p.endswith('_eeschema.kiface') or p.endswith('/kicad-cli')}
          assert len(engines)==2, engines
          for engine in engines:
              shutil.copy2(engine,root/'bin'/engine.name)
              result=subprocess.check_output(['ldd',str(engine)],text=True)
              (root/(engine.name+'.ldd.txt')).write_text(result)
              for name in re.findall(r'=> (/\S+)',result):
                  path=pathlib.Path(name)
                  if path.name not in {'libc.so.6','libm.so.6','libpthread.so.0','libdl.so.2','librt.so.1'}:
                      shutil.copy2(path,root/'lib'/path.name)
          for name in ('Package_QFP','Package_TO_SOT_SMD','Resistor_SMD','Capacitor_SMD','Capacitor_Tantalum_SMD','Connector_PinHeader_2.54mm'):
              path=pathlib.Path('/usr/share/kicad/footprints')/(name+'.pretty')
              assert path.is_dir(), path
              shutil.copytree(path,root/'footprints'/path.name)
          (root/'PACKAGES.txt').write_text(subprocess.check_output(['dpkg-query','-W'],text=True))
          run=subprocess.run(['kicad-cli','version'],capture_output=True,text=True,timeout=30)
          (root/'VERSION.txt').write_text(run.stdout+run.stderr)
          assert run.returncode==0 and run.stdout.strip()=='9.0.2', (run.returncode,run.stdout,run.stderr)
          PY
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git bundle create /tmp/kicad-out/source.bundle --all
          tar -C /tmp -czf /tmp/kicad-out/kicad-runtime.tar.gz kicad-export
          sha256sum /tmp/kicad-out/*.gz /tmp/kicad-out/*.bundle > /tmp/kicad-out/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kicad-schematic-engine
          path: /tmp/kicad-out/
          if-no-files-found: error
          retention-days: 7
