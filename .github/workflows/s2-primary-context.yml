name: S2 Primary Context
on:
  push:
    branches: [workbench/s2-primary-context]
    paths: [.github/workflows/s2-primary-context.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 7325d659aeedf2628cf2a4430854e90ef1277785
          fetch-depth: 0
          persist-credentials: false
      - name: Capture immutable source and primary reference bytes
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 7325d659aeedf2628cf2a4430854e90ef1277785
          test "$(git rev-parse HEAD^{tree})" = 85b324a5445ca653afd16990311a04ccd9622ae5
          mkdir -p "$RUNNER_TEMP/context"
          git branch captured-s1 HEAD
          git bundle create "$RUNNER_TEMP/context/repository.bundle" captured-s1
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/context/identity.txt"
          for name in txu0304 ads1299 tps3703; do
            curl --fail --location --max-time 45 --retry 1 "https://www.ti.com/lit/ds/symlink/$name.pdf" -o "$RUNNER_TEMP/context/$name.pdf"
          done
          python - <<'PY'
          import os,pathlib,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'context'
          for name in ('txu0304','ads1299','tps3703'):
              assert (root/(name+'.pdf')).read_bytes().startswith(b'%PDF-'),name
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(root.iterdir()) if p.is_file()))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s2-primary-context
          path: ${{ runner.temp }}/context/
          retention-days: 14
          if-no-files-found: error
