name: Capacitor E1 source
on:
  push:
    branches: [workbench/capacitor-e1-source]
    paths: [.github/workflows/capacitor-e1-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 905347aa361669af0634fd84688b1ce7b3755e07
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve the exact existing source without changing CAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 905347aa361669af0634fd84688b1ce7b3755e07
          test "$(git rev-parse HEAD^{tree})" = 998bc610dc5d956967dad697e5a0623495c94357
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source"
          git branch capacitor-e1-source HEAD
          git bundle create "$RUNNER_TEMP/source/repository.bundle" capacitor-e1-source
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          sha256sum hardware/rev_a/layout/rev_a.kicad_pcb > "$RUNNER_TEMP/source/board.sha256"
          cd "$RUNNER_TEMP/source"
          sha256sum repository.bundle identity.txt board.sha256 > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capacitor-e1-source
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 7
