name: Publish S1 File Reference
on:
  push:
    branches: [workbench/supply-return-finish]
    paths: [.github/workflows/s1-file-reference.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Fetch only public-source correction history and verify bytes
        env:
          SOURCE_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-4040-8246-9c5d-f77af32a8744/raw?se=2026-10-04T18%3A06%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=176e30e2-3925-5a27-8aa7-ea7395f3147c&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T06%3A34%3A00Z&ske=2026-10-05T06%3A34%3A00Z&sks=b&skv=2026-02-06&sig=Fcy8fc9k9WR/TivFAO/zV0pQvdQb2I6iYEwbUSYgTiw%3D'
        run: |
          set -eu
          curl --fail --silent --show-error --location --max-time 60 "$SOURCE_URL" -o "$RUNNER_TEMP/s1.bundle"
          python - <<'PY'
          import hashlib,os,pathlib
          data=pathlib.Path(os.environ['RUNNER_TEMP'],'s1.bundle').read_bytes()
          assert len(data)==3005
          assert hashlib.sha256(data).hexdigest()=='6fc1386e3436087527b03ffb5614dbe2c4e2ecdede2aab68580fd1229d1e1753'
          PY
      - name: Preserve original commits without running proposed project code
        run: |
          set -eu
          MAIN=f6932ead58c1d02af145de405312a7f885dbb010
          BASE=bb1fdd5f9ffeb31c04474a82dddfe078a4042fd8
          HEAD=6a8fb444e88488441fc165cf97ab2aa54d9bbbae
          TREE=85b324a5445ca653afd16990311a04ccd9622ae5
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin refs/heads/review/supply-return-s1 | cut -f1)" = "$BASE"
          git bundle verify "$RUNNER_TEMP/s1.bundle"
          git fetch "$RUNNER_TEMP/s1.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD"
          test "$(git rev-parse "$HEAD^{tree}")" = "$TREE"
          test "$(git rev-list --count "$BASE..$HEAD")" = 3
          python - "$BASE" "$HEAD" <<'PY'
          import subprocess,sys
          actual=set(subprocess.check_output(['git','diff','--name-only',*sys.argv[1:]],text=True).splitlines())
          assert actual=={'docs/REV_A_SUPPLY_RETURN_S1.md','docs/LLM_HANDOFF.md','docs/REV_A_COMPLETION_ROADMAP.md','tests/test_supply_inventory.py'}
          PY
          git diff --exit-code "$MAIN" "$HEAD" -- .github hardware firmware lab pyproject.toml uv.lock
          git fsck --no-dangling "$HEAD"
          existing=$(git ls-remote origin refs/heads/recovery/s1-pth-6a8fb44 | cut -f1)
          test -z "$existing" || test "$existing" = "$HEAD"
          git push origin "$HEAD:refs/heads/recovery/s1-pth-6a8fb44"
          git clone --no-local --branch recovery/s1-pth-6a8fb44 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/fresh"
          cd "$RUNNER_TEMP/fresh"
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/receipt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/receipt/identity.txt"
          git bundle create "$RUNNER_TEMP/receipt/source.bundle" HEAD
          cd "$RUNNER_TEMP/receipt"
          sha256sum source.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-s1-pth-source
          path: ${{ runner.temp }}/receipt/
          retention-days: 14
          if-no-files-found: error
