name: Disposable capacitor source capture
on:
  pull_request:
permissions:
  contents: read
jobs:
  public-sources:
    if: github.head_ref == 'investigate/murata-source-capture'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Render the public catalog without login or form submission
        shell: python
        run: |
          import hashlib, json, pathlib, shutil, subprocess, time, urllib.request
          out = pathlib.Path('source-capture')
          out.mkdir()
          url = 'https://ds.murata.com/simsurfing/mlcc.html?oripartnumbers=%5B%22GRM219R61A106KE44D%22%5D&partnumbers=%5B%22GRM219R61A106KE44%22%5D'
          report = {'scope': 'public_catalog_render_only', 'utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), 'url': url, 'physical_hardware_tested': False}
          chrome = shutil.which('google-chrome') or shutil.which('chromium')
          if chrome:
            report['browser'] = subprocess.check_output([chrome, '--version'], text=True).strip()
            command = [chrome, '--headless', '--no-sandbox', '--disable-gpu', '--virtual-time-budget=20000', '--dump-dom', url]
            with (out / 'rendered.html').open('w') as text, (out / 'browser.log').open('w') as log:
              try:
                result = subprocess.run(command, stdout=text, stderr=log, timeout=65)
                report['browser_returncode'] = result.returncode
              except subprocess.TimeoutExpired:
                report['browser_error'] = 'bounded browser render timed out'
          else:
            report['browser_error'] = 'no browser installed'
          sources = {}
          for name, link in {
            'mlcc-functions': 'https://ds.murata.com/simsurfing/muratalib/js/product/simsurfing_mlcc_func.min.js',
            'catalog-config': 'https://ds.murata.com/simsurfing_data/simsurfing_conf.js',
            'catalog-common': 'https://ds.murata.com/simsurfing/muratalib/js/simsurfing_common.min.js',
          }.items():
            row = {'url': link}
            try:
              request = urllib.request.Request(link, headers={'User-Agent': 'Mozilla/5.0', 'Referer': url})
              with urllib.request.urlopen(request, timeout=15) as response:
                data = response.read(5_000_001)
                if len(data) > 5_000_000:
                  raise ValueError('oversized public asset')
                row.update(status=response.status, final_url=response.url, sha256=hashlib.sha256(data).hexdigest(), bytes=len(data))
              (out / (name + '.js')).write_bytes(data)
            except Exception as exc:
              row['error'] = type(exc).__name__ + ': ' + str(exc)
            sources[name] = row
          report['sources'] = sources
          (out / 'CAPTURE.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report), flush=True)
      - name: Retain public render and failed retrievals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capacitor-source-capture
          path: source-capture/
          if-no-files-found: error
          retention-days: 14
