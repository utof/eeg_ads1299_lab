name: Publish final PR62 boundary review
on:
  push:
    branches: [workbench/pr62-review-continuation]
    paths: [.github/workflows/pr62-spur-final.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and import data-only source history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,pathlib,subprocess
          encoded=''.join(pathlib.Path('transfer/pr62-spur-final.b64').read_text().split())
          data=base64.b64decode(encoded,validate=True)
          assert len(data)==3858
          assert hashlib.sha256(data).hexdigest()=='2b93484e58d64a19c58f22e128a6cd46a0fa5751695e35fd6ff6d9b73d10dd3b'
          pathlib.Path('/tmp/final-review.bundle').write_bytes(data)
          subprocess.run(['git','bundle','verify','/tmp/final-review.bundle'],check=True)
          subprocess.run(['git','fetch','/tmp/final-review.bundle','HEAD'],check=True)
          PY
          test "$(git rev-parse FETCH_HEAD)" = 330f34c7a3f4d799d00e8563d8749e380757d455
          test "$(git rev-parse FETCH_HEAD^{tree})" = 81640a52e512cf54caa9e581ab78a3260f3b07c7
          git merge-base --is-ancestor 3514074ce07e84ecf7e3b607eec412f6b0dd0297 FETCH_HEAD
          test "$(git rev-list --count 3514074ce07e84ecf7e3b607eec412f6b0dd0297..FETCH_HEAD)" = 3
          git diff --exit-code 189a6e606b376224735ae05bc9c820fe74bcbed0 FETCH_HEAD -- hardware firmware lab pyproject.toml uv.lock
          git push origin 330f34c7a3f4d799d00e8563d8749e380757d455:refs/heads/archive/pr62-review-final-330f34c
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: archive/pr62-review-final-330f34c
          fetch-depth: 0
          path: fresh
          persist-credentials: false
      - name: Verify fresh checkout solely from GitHub
        shell: bash
        run: |
          set -euo pipefail
          cd fresh
          test "$(git rev-parse HEAD)" = 330f34c7a3f4d799d00e8563d8749e380757d455
          test "$(git rev-parse HEAD^{tree})" = 81640a52e512cf54caa9e581ab78a3260f3b07c7
          printf '%s  %s\n' 611218bae6559fb2488309fc80eee20ce2d6b5855977d52d600f947099179b43 hardware/rev_a/layout/rev_a.kicad_pcb | sha256sum -c -
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
          git log -7 --oneline
