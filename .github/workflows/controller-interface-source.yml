name: Controller interface source
on:
  push:
    branches: [workbench/controller-interface-source]
    paths: [.github/workflows/controller-interface-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 2b11ddec03a4fad97f6dbec2f00675fe5a48c09c
          fetch-depth: 0
          persist-credentials: false
      - name: Capture unchanged source
        run: |
          set -eu
          test "$(git rev-parse HEAD^{tree})" = 8b9b175d35f652abe8867f6891827e99040c128d
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source"
          git branch controller-source HEAD
          git bundle create "$RUNNER_TEMP/source/repository.bundle" controller-source
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum repository.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controller-interface-source
          path: ${{ runner.temp }}/source/
          retention-days: 7
          if-no-files-found: error
