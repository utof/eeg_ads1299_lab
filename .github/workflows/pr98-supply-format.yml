name: PR98 supply format and quality
on:
  push:
    branches: [workbench/pr98-source-publication-20261010]
    paths: [.github/workflows/pr98-supply-format.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      MPLBACKEND: Agg
      TERM: dumb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: bcff4880d035aa0b91e17b51c9f43a5727b15aa8
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing pinned environment
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
      - name: Format only two examples and bind S4 to the identical S3 program
        run: |
          uv run --locked python - <<'PY'
          import ast,hashlib,json,pathlib,re,subprocess
          def git(*args):return subprocess.check_output(['git',*args],timeout=60).decode().strip()
          base='bcff4880d035aa0b91e17b51c9f43a5727b15aa8'
          assert git('rev-parse','HEAD')==base and not git('status','--porcelain')
          out=pathlib.Path('reports/supply-format');out.mkdir(parents=True)
          names=['docs/REV_A_CURRENT_RETURN_S2.md','docs/REV_A_SUPPLY_ACCEPTANCE_S3.md']
          def blocks(name):
              return [ast.dump(ast.parse(s)) for s in re.findall(r'```python\n(.*?)\n```',pathlib.Path(name).read_text(),re.S)]
          before={p:blocks(p) for p in names};assert all(len(v)==1 for v in before.values())
          subprocess.run(['uv','run','--locked','ruff','format',*names],check=True,timeout=45)
          assert all(blocks(p)==before[p] for p in names),'formatter altered example AST'
          binding=pathlib.Path('docs/studies/s4_serial_evidence.json');m=json.loads(binding.read_text());original=json.loads(binding.read_text())
          p=pathlib.Path(names[1]);m['input_sha256'][names[1]]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert original['input_sha256'][names[1]]!=m['input_sha256'][names[1]]
          binding.write_text(json.dumps(m,indent=2)+'\n');names.append(str(binding))
          assert set(git('diff','--name-only').splitlines())==set(names)
          subprocess.run(['git','add','--',*names],check=True)
          tree=git('write-tree');files={}
          for n in names:
              p=pathlib.Path(n);q=out/'source'/n;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(p.read_bytes())
              files[n]={'blob':git('hash-object',n),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'source.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          (out/'receipt.json').write_text(json.dumps({'base':base,'tree':tree,'files':files,'examples_ast_unchanged':True,'s4_change':'one S3 document digest only','full_gate_passed':False,'source_published':False},indent=2)+'\n')
          PY
      - name: Run the shared quality gate without changing checks
        run: uv run --locked python -m tools.check --out reports/supply-format/check
      - name: Verify no additional source changes
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr98-supply-formatted-quality
          path: reports/supply-format/
          retention-days: 14
          if-no-files-found: error
