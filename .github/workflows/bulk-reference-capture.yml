name: Disposable bulk reference capture
on:
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    if: github.head_ref == 'investigate/bulk-reference-sheet-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Retrieve identified manufacturer-authored mirrors
        shell: python
        run: |
          import datetime, hashlib, json, pathlib, urllib.request
          out=pathlib.Path('reference-capture');out.mkdir()
          sources=[
            ('https://pneda.ltd/datasheetviewer/grm21br61c106ke15l.pdf','murata-reference-mirror.pdf'),
            ('https://www.farnell.com/datasheets/3929902.pdf','murata-product-search-2023.pdf'),
            ('https://www.farnell.com/datasheets/2006461.pdf','murata-pcn-2015.pdf')]
          receipts=[]
          for url,name in sources:
              record={'url':url,'file':name,'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              receipts.append(record)
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(request,timeout=35) as response:
                      data=response.read(5_000_001)
                      if len(data)>5_000_000 or not data.startswith(b'%PDF-'):raise ValueError('not bounded PDF')
                      record.update(final_url=response.url,status=response.status,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                  (out/name).write_bytes(data)
              except Exception as exc:
                  record['error']=type(exc).__name__+': '+str(exc)
          (out/'CAPTURE.json').write_text(json.dumps({'scope':'manufacturer_authored_mirrors_not_current_approval','receipts':receipts},indent=2)+'\n')
          if any('error' in r for r in receipts):raise SystemExit(1)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-bulk-reference
          path: reference-capture/
          if-no-files-found: error
          retention-days: 14
