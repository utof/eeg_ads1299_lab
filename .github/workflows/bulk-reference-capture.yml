name: Disposable bulk reference capture
on:
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    if: github.head_ref == 'investigate/bulk-reference-sheet-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Retrieve public exact-core reference sheet
        shell: python
        run: |
          import datetime, hashlib, json, pathlib, urllib.request
          out=pathlib.Path('reference-capture');out.mkdir()
          url='https://search.murata.co.jp/Ceramy/image/img/A01X/G101/ENG/GRM21BR61C106KE15-01.pdf'
          record={'scope':'public_reference_not_ordering_or_assembly_approval','url':url,'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=35) as response:
                  data=response.read(5_000_001)
                  if len(data)>5_000_000 or not data.startswith(b'%PDF-'):raise ValueError('not bounded PDF')
                  record.update(final_url=response.url,status=response.status,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              (out/'GRM21BR61C106KE15-01.pdf').write_bytes(data)
          except Exception as exc:
              record['error']=type(exc).__name__+': '+str(exc)
          (out/'CAPTURE.json').write_text(json.dumps(record,indent=2)+'\n')
          if 'error' in record:raise SystemExit(1)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-bulk-reference
          path: reference-capture/
          if-no-files-found: error
          retention-days: 14
