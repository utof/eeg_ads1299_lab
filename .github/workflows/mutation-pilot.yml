name: Mutation feasibility experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scoped-pilot:
    if: github.head_ref == 'spike/scoped-mutation-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.13'
      UV_PYTHON_DOWNLOADS: never
      MPLBACKEND: Agg
      TERM: dumb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Resolve and retain an isolated experiment lock
        run: |
          python -m pip install uv==0.12.18
          mkdir -p reports/mutation-pilot
          git rev-parse HEAD | tee reports/mutation-pilot/source-commit.txt
          uv export --locked --all-extras --no-emit-project --no-hashes --format requirements-txt --output-file /tmp/base-requirements.txt
          printf '%s\n' '-r /tmp/base-requirements.txt' 'mutmut==3.8.0' > /tmp/mutation-requirements.in
          uv pip compile --python-version 3.13 --generate-hashes /tmp/mutation-requirements.in --output-file reports/mutation-pilot/requirements.lock.txt
          uv venv .venv-mutation --python 3.13
          uv pip sync --python .venv-mutation/bin/python reports/mutation-pilot/requirements.lock.txt
          uv pip freeze --python .venv-mutation/bin/python > reports/mutation-pilot/installed.txt
      - name: Configure only the existing validation boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pyproject.toml')
          addition = '\n[tool.mutmut]\nsource_paths = ["lab/"]\nonly_mutate = ["lab/validation.py"]\npytest_add_cli_args_test_selection = ["tests/test_input_boundaries.py", "tests/test_adc.py", "tests/test_extended.py"]\n'
          path.write_text(path.read_text() + addition)
          Path('reports/mutation-pilot/experiment-config.txt').write_text(addition)
          PY
          .venv-mutation/bin/python -m pytest -q tests/test_input_boundaries.py tests/test_adc.py tests/test_extended.py | tee reports/mutation-pilot/baseline-tests.log
      - name: Run bounded mutation experiment
        shell: bash
        run: |
          set +e
          export PATH="$PWD/.venv-mutation/bin:$PATH"
          start=$(date +%s)
          timeout 420 mutmut run 'lab.validation*' > reports/mutation-pilot/mutmut.log 2>&1
          result=$?
          end=$(date +%s)
          printf 'exit_code=%s\nelapsed_seconds=%s\n' "$result" "$((end-start))" | tee reports/mutation-pilot/run-status.txt
          cat reports/mutation-pilot/mutmut.log
          mutmut results > reports/mutation-pilot/results.txt 2>&1
          cat reports/mutation-pilot/results.txt
          mutmut export-cicd-stats > reports/mutation-pilot/statistics.json 2>&1
          cat reports/mutation-pilot/statistics.json
          exit "$result"
      - name: Restore experiment-only working configuration
        if: always()
        run: git restore -- pyproject.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scoped-mutation-feasibility
          path: reports/mutation-pilot/
          retention-days: 14
