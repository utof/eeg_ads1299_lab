name: Disposable startup offline workbench
on:
  pull_request:
permissions:
  contents: read
jobs:
  export:
    if: github.head_ref == 'workbench/startup-offline-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_PYTHON: '3.11'
      UV_CACHE_DIR: /tmp/eeg-offline-cache
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare locked offline cache and repository bundle
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
          mkdir -p /tmp/eeg-export
          git bundle create /tmp/eeg-export/source.bundle --all
          cp "$(command -v uv)" /tmp/eeg-export/uv
          tar -C /tmp -czf /tmp/eeg-export/uv-cache.tar.gz eeg-offline-cache
          git rev-parse HEAD > /tmp/eeg-export/SOURCE_HEAD.txt
          uv --version > /tmp/eeg-export/UV_VERSION.txt
          python --version > /tmp/eeg-export/PYTHON_VERSION.txt
          sha256sum /tmp/eeg-export/source.bundle /tmp/eeg-export/uv-cache.tar.gz > /tmp/eeg-export/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: startup-offline-environment
          path: /tmp/eeg-export/
          if-no-files-found: error
          retention-days: 7
