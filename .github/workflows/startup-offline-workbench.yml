name: Disposable startup offline workbench
on:
  pull_request:
permissions:
  contents: read
jobs:
  native-export:
    if: github.head_ref == 'workbench/startup-offline-20260926'
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Install distribution-native inspection tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git python3 ngspice kicad kicad-symbols
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 0595d457b6272b9db2627cf48e87a89756663c4a
          fetch-depth: 0
          persist-credentials: false
      - name: Retain portable binaries and exact provenance
        run: |
          mkdir -p /tmp/eeg-native/bin /tmp/eeg-native/lib /tmp/eeg-native/symbols /tmp/eeg-native/out
          cp /usr/bin/ngspice /usr/bin/kicad-cli /tmp/eeg-native/bin/
          python3 - <<'PY'
          import pathlib, re, shutil, subprocess
          root = pathlib.Path('/tmp/eeg-native')
          for exe in ('/usr/bin/ngspice', '/usr/bin/kicad-cli'):
              output = subprocess.check_output(['ldd', exe], text=True)
              (root / (pathlib.Path(exe).name + '-ldd.txt')).write_text(output)
              for name in re.findall(r'=> (/\S+)', output):
                  path = pathlib.Path(name)
                  if path.name not in {'libc.so.6', 'libm.so.6', 'libpthread.so.0', 'libdl.so.2', 'librt.so.1'}:
                      shutil.copy2(path, root / 'lib' / path.name)
          for name in ('Device.kicad_sym', 'Connector_Generic.kicad_sym', 'Analog_ADC.kicad_sym', 'Regulator_Linear.kicad_sym', 'power.kicad_sym'):
              source = pathlib.Path('/usr/share/kicad/symbols') / name
              if source.exists(): shutil.copy2(source, root / 'symbols' / name)
          PY
          ngspice --version > /tmp/eeg-native/NGSPICE_VERSION.txt
          kicad-cli version > /tmp/eeg-native/KICAD_VERSION.txt
          kicad-cli sch erc --help > /tmp/eeg-native/ERC_HELP.txt
          dpkg-query -W > /tmp/eeg-native/PACKAGES.txt
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git bundle create /tmp/eeg-native/out/source.bundle --all
          tar -C /tmp -czf /tmp/eeg-native/out/native-tools.tar.gz eeg-native/bin eeg-native/lib eeg-native/symbols eeg-native/NGSPICE_VERSION.txt eeg-native/KICAD_VERSION.txt eeg-native/ERC_HELP.txt eeg-native/PACKAGES.txt eeg-native/ngspice-ldd.txt eeg-native/kicad-cli-ldd.txt
          sha256sum /tmp/eeg-native/out/* > /tmp/eeg-native/out/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cad-simulator-environment
          path: /tmp/eeg-native/out/
          if-no-files-found: error
          retention-days: 7
