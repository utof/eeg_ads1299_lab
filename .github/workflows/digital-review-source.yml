name: Digital review source checkout
on:
  push:
    branches: [workbench/digital-return-review]
    paths: [.github/workflows/digital-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 5ece3051f685c9fc70dee804d83061d5e59b2f48
          fetch-depth: 0
          persist-credentials: false
      - name: Retain existing source without regenerating the board
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5ece3051f685c9fc70dee804d83061d5e59b2f48
          test "$(git rev-parse HEAD^{tree})" = 81640a52e512cf54caa9e581ab78a3260f3b07c7
          mkdir -p "$RUNNER_TEMP/source"
          git branch digital-review-source HEAD
          git bundle create "$RUNNER_TEMP/source/repository.bundle" digital-review-source
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          sha256sum hardware/rev_a/layout/rev_a.kicad_pcb > "$RUNNER_TEMP/source/board.sha256"
          test -z "$(git status --porcelain)"
          cd "$RUNNER_TEMP/source"
          sha256sum repository.bundle identity.txt board.sha256 > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digital-review-source
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 7
