name: Output repair source checkout
on:
  push:
    branches: [workbench/digital-output-repair]
    paths: [.github/workflows/output-repair-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: f834221a092f78dee4191305a3c3a8a03def0283
          fetch-depth: 0
          persist-credentials: false
      - name: Capture existing source without regenerating the board
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f834221a092f78dee4191305a3c3a8a03def0283
          test "$(git rev-parse HEAD^{tree})" = 6f675b9152e51d6ae78ed8bb986e06749df10cb3
          mkdir -p "$RUNNER_TEMP/source"
          git branch output-repair-source HEAD
          git bundle create "$RUNNER_TEMP/source/repository.bundle" output-repair-source
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          sha256sum hardware/rev_a/layout/rev_a.kicad_pcb > "$RUNNER_TEMP/source/board.sha256"
          test -z "$(git status --porcelain)"
          cd "$RUNNER_TEMP/source"
          sha256sum repository.bundle identity.txt board.sha256 > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: output-repair-source
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 7
