name: Review red-phase evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.18
      - run: uv sync --locked --all-extras
      - name: Show formatting differences without changing source
        run: uv run --locked ruff format --diff . || true
      - name: Observe intended behavior failures before implementation
        run: uv run --locked python -m pytest tests/test_review_regressions.py -q --junitxml=reports/review-red.xml
      - name: Retain red-phase evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-red-phase
          path: reports/review-red.xml
