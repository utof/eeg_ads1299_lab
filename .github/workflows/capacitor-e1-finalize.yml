name: Verify capacitor decision source
on:
  push:
    branches: [workbench/capacitor-e1-source]
    paths: [.github/workflows/capacitor-e1-finalize.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 0d7d6f41b137c27c2034c8fb0ad6b516a8fc0995
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
      - name: Correct a recorded digest transcription and apply the pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('docs/checkpoints/20260930_capacitor_e1.json')
          data=json.loads(p.read_text())
          assert data['T491']['sha256']=='c3c5bb70009b606c87b40156259670ca9c8452f172b73faa9e2dbf2cee3522d'
          data['T491']['sha256']='c3c5bb70009b606c87b40156259670ca9c8452f172b73faa9e2dbf2fcee3522d'
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          uv run --locked ruff format docs/REV_A_CAPACITOR_E1_DECISION.md
          uv run --locked ruff format --check .
      - name: Execute exact accounting block and reject three corrupt-data controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          export EVIDENCE="$RUNNER_TEMP/evidence"
          uv run --locked --all-extras python - <<'PY'
          import contextlib,hashlib,io,json,os,pathlib,re
          p=pathlib.Path('docs/checkpoints/20260930_capacitor_e1.json')
          d=pathlib.Path('docs/REV_A_CAPACITOR_E1_DECISION.md')
          code=re.search(r'```python\n(.*?)\n```',d.read_text(),re.S).group(1)
          original=p.read_bytes()
          with contextlib.redirect_stdout(io.StringIO()) as output:
              exec(compile(code,str(d),'exec'),{'__name__':'__main__'})
          result={'kind':'documentation_analysis_not_project_tests_or_physical_measurements','code_sha256':hashlib.sha256(code.encode()).hexdigest(),'canonical_pass':True,'derived':json.loads(output.getvalue()),'probes':{}}
          for name in ('AVDD_plus10u','discontinued_relabelled_B','invented_guaranteed_min'):
              try:
                  data=json.loads(original)
                  if name=='AVDD_plus10u':data['nominal_shunt_uF']['AVDD']+=10
                  elif name=='discontinued_relabelled_B':data['manufacturer_catalog']['states_by_current_core']['GRM219R61A106KE44']='B'
                  else:data['qualification_targets'][1]['guaranteed_effective_min_uF']=0.85
                  p.write_text(json.dumps(data))
                  try:
                      with contextlib.redirect_stdout(io.StringIO()):exec(compile(code,str(d),'exec'),{'__name__':'__main__'})
                  except AssertionError:result['probes'][name]='rejected'
                  else:raise RuntimeError('incorrect data accepted: '+name)
              finally:p.write_bytes(original)
          assert p.read_bytes()==original
          data=json.loads(original)
          data['reproduction']={'python_block_sha256':result['code_sha256'],'accounting_executed':True,'corrupt_data_probes':result['probes'],'new_project_tests':0,'native_or_physical_tests':False}
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          pathlib.Path(os.environ['EVIDENCE'],'analysis.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Publish only the two documentation corrections to an archive branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0d7d6f41b137c27c2034c8fb0ad6b516a8fc0995
          git diff --exit-code -- hardware firmware lab tools tests pyproject.toml uv.lock .github
          test "$(git diff --name-only | wc -l)" = 2
          git add docs/REV_A_CAPACITOR_E1_DECISION.md docs/checkpoints/20260930_capacitor_e1.json
          git -c user.name='Repository automation' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'docs(evidence): verify capacitor accounting and normalize the retained source record'
          git push origin HEAD:refs/heads/archive/capacitor-e1-verified
          echo "VERIFIED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/identity.txt"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.VERIFIED_HEAD }}
          path: fresh
          fetch-depth: 0
          persist-credentials: false
      - name: Verify separate GitHub checkout and retain exact source
        shell: bash
        run: |
          set -euo pipefail
          cd fresh
          test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD"
          test -z "$(git status --porcelain)"
          git diff --exit-code 905347aa HEAD -- hardware firmware lab tools tests pyproject.toml uv.lock .github
          test "$(git diff --name-only 905347aa HEAD | wc -l)" = 4
          printf '%s  %s\n' 5da65b4307f0336883da9aeae48711b28c1944ec587f5d3174f12db4e9921875 hardware/rev_a/layout/rev_a.kicad_pcb | sha256sum -c -
          git branch capacitor-e1-verified HEAD
          git bundle create "$RUNNER_TEMP/evidence/repository.bundle" capacitor-e1-verified
          cd "$RUNNER_TEMP/evidence"
          sha256sum analysis.json identity.txt repository.bundle > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capacitor-e1-verified-source
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 7
