name: Published E1 source
on:
  push:
    branches: [workbench/stackup-envelope-source]
    paths: [.github/workflows/stackup-envelope-final-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: f7d916357375b6da4ec8849866435f821d146566
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source tree, scope and unchanged board
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f7d916357375b6da4ec8849866435f821d146566
          test "$(git rev-parse HEAD^{tree})" = 86cf1f918768c573c8fbc254928f2d32eff23e30
          test "$(git diff --name-only 8403c4ee HEAD | wc -l)" = 4
          git diff --exit-code 8403c4ee HEAD -- hardware firmware lab tools tests pyproject.toml uv.lock .github
          printf '%s  %s\n' 5da65b4307f0336883da9aeae48711b28c1944ec587f5d3174f12db4e9921875 hardware/rev_a/layout/rev_a.kicad_pcb | sha256sum -c -
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source"
          git branch e1-published-source HEAD
          git bundle create "$RUNNER_TEMP/source/repository.bundle" e1-published-source
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          cd "$RUNNER_TEMP/source"
          sha256sum repository.bundle identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stackup-envelope-published-source
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          retention-days: 7
