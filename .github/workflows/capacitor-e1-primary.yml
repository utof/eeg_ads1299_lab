name: Capacitor E1 primary sources
on:
  push:
    branches: [workbench/capacitor-e1-source]
    paths: [.github/workflows/capacitor-e1-primary.yml]
permissions: {}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Capture public catalog rows and exact technical sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cap-evidence"
          export OUT="$RUNNER_TEMP/cap-evidence"
          python3 - <<'PY'
          import csv,datetime,hashlib,io,json,os,pathlib,urllib.request,zipfile
          out=pathlib.Path(os.environ['OUT'])
          def fetch(url,name):
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=90) as response:
                  data=response.read(120_000_001)
                  assert len(data)<=120_000_000
                  receipt={'url':url,'final_url':response.url,'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'content_type':response.headers.get('Content-Type')}
              if name: (out/name).write_bytes(data)
              return data,receipt
          data,receipt=fetch('https://ds.murata.com/simsurfing_data/data/mlcc.zip',None)
          archive=zipfile.ZipFile(io.BytesIO(data))
          names=[n for n in archive.namelist() if n.lower().endswith('.csv')]
          print('CSV names',names[:10],flush=True)
          cores=['GRM219R61A106KE44','GRM188R61E105KA12','GRM188R71H104KA93','GRM1885C1H472JA01','GRM1885C1H152JA01','GRM21BR61C106KE15','GRM188R61E105KAAD','GRM188R71H104KA01','GRM185R61E105KA12']
          keep=['part_number','public_part_number','channel_code','production_status_ja','production_status_en-us','production_status_zh-cn','L','W','size_thickness_max','LWSize_mm_inch','tempchar','rvol','tolerance','capacitance_pu','Condition','TC_Condition']
          rows={};csv_records=[]
          for name in names:
              raw=archive.read(name)
              text=raw.decode('utf-8-sig')
              reader=csv.DictReader(io.StringIO(text))
              print('fields',reader.fieldnames[:25],flush=True)
              csv_records.append({'name':name,'sha256':hashlib.sha256(raw).hexdigest()})
              for row in reader:
                  core=row.get('part_number','')
                  if core in cores:
                      rows.setdefault(core,[]).append({k:row.get(k) for k in keep})
          result={'catalog':receipt,'csv':csv_records,'rows':rows,'missing_cores':sorted(set(cores)-set(rows)),'pdfs':{},'errors':{}}
          try:
              _,legend=fetch('https://ds.murata.com/simsurfing/img/supply_status/supply_status_info_en-us.png','status-legend.png')
              result['legend']=legend
          except Exception as e: result['errors']['legend']=str(e)
          for core in ['GRM21BR61C106KE15','GRM188R61E105KAAD','GRM188R71H104KA01','GRM185R61E105KA12']:
              if core not in rows: continue
              url='https://ds.murata.com/simserve/characteristics?ReqType=TechPDF&partnumber='+core+'&techpdfname=technical_pdf_Capacitor01&lang=en'
              try:
                  pdf,record=fetch(url,core+'.pdf');assert pdf.startswith(b'%PDF-')
                  result['pdfs'][core]=record
              except Exception as e: result['errors'][core]=str(e)
          (out/'capture.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.is_file()))
          print(json.dumps(result,ensure_ascii=False),flush=True)
          assert rows, 'no exact catalog rows found'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capacitor-e1-primary
          path: ${{ runner.temp }}/cap-evidence/
          if-no-files-found: error
          retention-days: 7
