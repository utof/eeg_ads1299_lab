name: Implement reviewed Rev A study
on:
  push:
    branches: [feat/rev-a-input-study]
    paths: ['.github/apply_input_study.py', '.github/workflows/author-input-study.yml']
permissions:
  contents: write
jobs:
  implement:
    if: github.repository == 'utof/eeg_ads1299_lab' && github.ref == 'refs/heads/feat/rev-a-input-study'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the locked environment and simulator
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --all-extras
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ngspice g++ nodejs > /tmp/native-install.log
      - name: Execute the test-first API contract before implementation
        run: |
          test ! -e lab/rev_a.py
          if uv run --locked python -m pytest tests/test_rev_a_study.py -q; then
            echo 'Unexpected pass before implementation'; exit 1
          fi
      - name: Apply reviewed source and remove temporary authoring files
        run: |
          uv run --locked python .github/apply_input_study.py
          rm .github/apply_input_study.py .github/workflows/author-input-study.yml
          uv run --locked ruff check --fix .
          uv run --locked ruff format .
          git diff --exit-code 809aa566963337b3fb6168c4d973a6021045f785 -- 'hardware/rev_a/*.json' firmware results VALIDATION.json SHA256SUMS.txt requirements-tested.txt lab/analog
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(simulation): study the locked Rev A passive input network'
          git push origin HEAD:refs/heads/feat/rev-a-input-study
      - name: Run the complete quality and real native gate
        run: uv run --locked python -m tools.check --native
      - name: Show independent diagnostics on failure
        if: failure()
        run: |
          uv run --locked pyrefly check --min-severity warn || true
          uv run --locked complexipy --failed || true
          uv run --locked tach check || true
          uv run --locked python -m pytest tests/test_rev_a_study.py -q || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rev-a-study-evidence
          path: reports/
